<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sistema - Inicio')}">
</head>
<body style="background: var(--bg-color);">

    <!-- Left Sidebar Menu -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Top Navbar -->
        <div th:replace="~{fragments/layout :: navbar('Inicio')}"></div>

        <!-- Dynamic Content Area -->
        <div class="content-area" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: calc(100vh - 80px); padding: 2rem; box-sizing: border-box;">
            
            <!-- Context Info Card -->
            <div style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px); border-radius: 20px; border: 1px solid rgba(203, 213, 225, 0.8); padding: 2.25rem 2.5rem; max-width: 680px; width: 100%; box-shadow: 0 20px 40px -15px rgba(22, 101, 52, 0.12); margin-top: auto; margin-bottom: 2rem;">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1.25rem;">
                    <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #f0fdf4, #dcfce7); border: 1px solid #86efac; display: flex; align-items: center; justify-content: center; color: #15803d; font-size: 1.6rem; flex-shrink: 0; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);">
                        <i class="ph ph-buildings"></i>
                    </div>
                    <div style="flex: 1;">
                        <span style="font-size: 0.72rem; font-weight: 800; color: #16a34a; text-transform: uppercase; letter-spacing: 0.08em;">Contribuyente / Empresa</span>
                        <h3 style="margin: 2px 0 0 0; font-weight: 800; font-size: 1.25rem; color: #0f172a;" th:text="${session.empresaDesc != null ? session.empresaDesc : (session.empresa != null ? session.empresa : 'Contexto de Trabajo')}">YGUAZU S.A.</h3>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem;">
                    <!-- Ejercicio -->
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
                        <div style="display: flex; align-items: center; gap: 6px; color: #15803d; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;">
                            <i class="ph ph-calendar-blank" style="font-size: 1rem;"></i> Ejercicio Contable
                        </div>
                        <div style="font-weight: 800; font-size: 1.2rem; color: #0f172a;" th:text="${session.ejercicio != null and session.ejercicio != '' ? session.ejercicio : 'Sin Ejercicio'}">2026</div>
                        <div th:if="${session.fecInicio != null and session.fecInicio != ''}" style="font-size: 0.75rem; color: #64748b; margin-top: 4px; font-weight: 600;" th:text="${session.fecInicio + ' - ' + session.fecFinal}">01/01/2026 - 31/12/2026</div>
                    </div>

                    <!-- Sucursal -->
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
                        <div style="display: flex; align-items: center; gap: 6px; color: #15803d; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;">
                            <i class="ph ph-storefront" style="font-size: 1rem;"></i> Sucursal
                        </div>
                        <div style="font-weight: 800; font-size: 1rem; color: #0f172a;" th:text="${session.sucursalDesc != null and session.sucursalDesc != '' ? session.sucursalDesc : (session.sucursal != null ? session.sucursal : '-')}">01 - MATRIZ</div>
                    </div>

                    <!-- Actividad -->
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
                        <div style="display: flex; align-items: center; gap: 6px; color: #15803d; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;">
                            <i class="ph ph-briefcase" style="font-size: 1rem;"></i> Actividad
                        </div>
                        <div style="font-weight: 800; font-size: 1rem; color: #0f172a;" th:text="${session.actividad != null and session.actividad != '' ? session.actividad : 'COMERCIAL'}">COMERCIAL</div>
                    </div>

                    <!-- Usuario -->
                    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 1rem;">
                        <div style="display: flex; align-items: center; gap: 6px; color: #15803d; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px;">
                            <i class="ph ph-user" style="font-size: 1rem;"></i> Usuario Conectado
                        </div>
                        <div style="font-weight: 800; font-size: 1rem; color: #0f172a;" th:text="${session.nombrePersona != null ? session.nombrePersona : session.usuario}">USUARIO</div>
                    </div>
                </div>
            </div>

            <!-- Footer Badge -->
            <div style="margin-top: auto; margin-bottom: 1.5rem; text-align: center;">
                <a href="https://www.josystem.click/" target="_blank" rel="noopener noreferrer" style="text-decoration: none; display: inline-flex; align-items: center; background: #0b1325; border: 1.5px solid rgba(0, 153, 255, 0.45); padding: 0.65rem 1.6rem; border-radius: 9999px; gap: 0.75rem; font-size: 0.95rem; color: #ffffff; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); transition: all 0.2s ease; cursor: pointer;">
                    <span style="color: #f1f5f9; font-weight: 600;">Desarrollado por</span>
                    <div style="display: flex; align-items: center; gap: 0.55rem;">
                        <div style="background: #0099ff; color: white; padding: 0.22rem 0.6rem; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: monospace; font-size: 0.9rem; box-shadow: 0 0 16px rgba(0, 153, 255, 0.8);">&lt;/&gt;</div>
                        <span style="color: #0099ff; font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em;">JO System</span>
                    </div>
                    <div style="width: 1.5px; height: 20px; background: #475569; margin: 0 0.2rem;"></div>
                    <span style="color: #0099ff; font-weight: 800; letter-spacing: 0.06em; font-size: 0.82rem;">SOFTWARE</span>
                </a>
            </div>

        </div>
    </main>

    <!-- Layout Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
