<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sucursales (SUCURSALES) - Sistema Contable')}">
</head>
<body style="background: var(--bg-color);">

    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div th:replace="~{fragments/layout :: navbar('Directorio de Sucursales')}"></div>

        <div class="content-area">
            <div style="background: white; border-radius: 14px; border: 1px solid #cbd5e1; box-shadow: 0 8px 25px rgba(0,0,0,0.06); overflow: hidden; width: 100%;">
                
                <div style="padding: 14px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                    <div style="display: flex; gap: 10px;">
                        <button type="button" class="btn" onclick="abrirModalNuevo()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #1e293b; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-plus-circle" style="color: #16a34a;"></i> Nueva Sucursal
                        </button>
                        <button type="button" class="btn" onclick="abrirModalEditar()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #1e293b; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-pencil-simple" style="color: #15803d;"></i> Modificar
                        </button>
                        <button type="button" class="btn" onclick="eliminarRegistro()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #ef4444; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-trash"></i> Eliminar
                        </button>
                    </div>

                    <div style="position: relative; width: 280px;">
                        <input type="text" id="searchInput" class="form-control" placeholder="BUSCAR SUCURSAL..." onkeyup="filtrarRegistros()" style="padding-right: 36px; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; border-radius: 8px; border: 1px solid #cbd5e1; background: #fafafa;">
                        <i class="ph ph-magnifying-glass" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #16a34a;"></i>
                    </div>
                </div>

                <div style="overflow-x: auto;">
                    <table class="table table-hover align-middle m-0" style="font-size: 0.88rem;">
                        <thead style="background: #f1f5f9; color: #475569; font-weight: 800; text-transform: uppercase; font-size: 0.76rem;">
                            <tr>
                                <th style="padding: 14px 20px;">Código</th>
                                <th style="padding: 14px 20px;">Descripción</th>
                                <th style="padding: 14px 20px;">Dirección</th>
                                <th style="padding: 14px 20px;">Teléfono</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody">
                            <tr><td colspan="4" class="text-center py-4 text-muted">Cargando sucursales...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="modalOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; border-radius: 14px; border: 1px solid #94a3b8; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); width: 100%; max-width: 600px; overflow: hidden;">
            <div style="padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <h4 id="modalTitle" style="margin: 0; font-size: 1.05rem; font-weight: 800; color: #0f172a;">Nueva Sucursal (SUCURSALES)</h4>
                <button type="button" class="btn-close" onclick="cerrarModal()"></button>
            </div>
            <div style="padding: 24px;">
                <form id="formSuc">
                    <input type="hidden" id="codSucursal">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Descripción de Sucursal :</label>
                        <input type="text" id="descripcion" class="form-control" placeholder="EJ: CASA MATRIZ / CENTRO" required style="font-weight: 700;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Dirección :</label>
                        <input type="text" id="direccion" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small">Teléfono :</label>
                        <input type="text" id="telefono" class="form-control">
                    </div>
                </form>
            </div>
            <div style="padding: 14px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="guardarRegistro()" style="background: #16a34a; border: none; font-weight: 700;">Guardar</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        let listData = [];
        let selectedId = null;

        document.addEventListener('DOMContentLoaded', cargarRegistros);

        function cargarRegistros() {
            fetch('/api/co_sucursales/list')
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        listData = res.data || [];
                        renderTabla(listData);
                    }
                });
        }

        function renderTabla(data) {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No se encontraron sucursales.</td></tr>';
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                if (selectedId && selectedId == item.COD_SUCURSAL) tr.classList.add('fila-seleccionada');
                tr.onclick = function() {
                    document.querySelectorAll('#tablaBody tr').forEach(r => r.classList.remove('fila-seleccionada'));
                    tr.classList.add('fila-seleccionada');
                    selectedId = item.COD_SUCURSAL;
                };
                tr.ondblclick = abrirModalEditar;
                tr.innerHTML = `
                    <td class="fw-bold text-primary" style="padding: 12px 20px;"><span class="badge bg-light text-primary border" style="font-size:0.85rem; padding: 4px 8px;">${item.COD_SUCURSAL || ''}</span></td>
                    <td style="padding: 12px 20px; font-weight: 700; color: #1e293b;">${item.DESCRIPCION || ''}</td>
                    <td style="padding: 12px 20px;">${item.DIRECCION || '-'}</td>
                    <td style="padding: 12px 20px;">${item.TELEFONO || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarRegistros() {
            const query = document.getElementById('searchInput').value.trim().toUpperCase();
            if (!query) return renderTabla(listData);
            renderTabla(listData.filter(i => (i.DESCRIPCION && i.DESCRIPCION.toUpperCase().includes(query)) || (i.COD_SUCURSAL && i.COD_SUCURSAL.includes(query))));
        }

        function abrirModalNuevo() {
            document.getElementById('formSuc').reset();
            document.getElementById('codSucursal').value = '';
            document.getElementById('modalTitle').innerText = 'Nueva Sucursal (SUCURSALES)';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function abrirModalEditar() {
            if (!selectedId) return Swal.fire('Atención', 'Seleccione un registro.', 'warning');
            const item = listData.find(x => x.COD_SUCURSAL == selectedId);
            if (!item) return;
            document.getElementById('codSucursal').value = item.COD_SUCURSAL;
            document.getElementById('descripcion').value = item.DESCRIPCION || '';
            document.getElementById('direccion').value = item.DIRECCION || '';
            document.getElementById('telefono').value = item.TELEFONO || '';
            document.getElementById('modalTitle').innerText = 'Modificar Sucursal #' + item.COD_SUCURSAL;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function guardarRegistro() {
            const descripcion = document.getElementById('descripcion').value.trim();
            if (!descripcion) return Swal.fire('Atención', 'La descripción es obligatoria.', 'warning');

            const payload = {
                codSucursal: document.getElementById('codSucursal').value,
                descripcion: descripcion,
                direccion: document.getElementById('direccion').value,
                telefono: document.getElementById('telefono').value
            };

            fetch('/api/co_sucursales/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire('¡Éxito!', data.message, 'success');
                    cerrarModal();
                    cargarRegistros();
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            });
        }

        function eliminarRegistro() {
            if (!selectedId) return Swal.fire('Atención', 'Seleccione un registro.', 'warning');
            Swal.fire({
                title: '¿Eliminar sucursal?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444'
            }).then(r => {
                if (r.isConfirmed) {
                    fetch('/api/co_sucursales/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ codSucursal: selectedId })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            Swal.fire('Eliminado', data.message, 'success');
                            selectedId = null;
                            cargarRegistros();
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
