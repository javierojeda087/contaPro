<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Directorio de Personas (CO_PERSONAS) - Sistema Contable')}">
</head>
<style>
    .swal2-container {
        z-index: 3000 !important;
    }
    .selected-row {
        background-color: #bbf7d0 !important;
        border-left: 6px solid #16a34a !important;
    }
    .selected-row td {
        background-color: #bbf7d0 !important;
        color: #0f172a !important;
    }
    tr.selected-row:hover td {
        background-color: #86efac !important;
    }
</style>
<body style="background: var(--bg-color);">

    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div th:replace="~{fragments/layout :: navbar('Directorio de Personas')}"></div>

        <div class="content-area">
            
            <div style="background: white; border-radius: 14px; border: 1px solid #cbd5e1; box-shadow: 0 8px 25px rgba(0,0,0,0.06); overflow: hidden; width: 100%;">
                
                <div style="padding: 14px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button type="button" class="btn" onclick="abrirModalNuevo()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #1e293b; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-plus-circle" style="color: #16a34a; font-size: 1.15rem;"></i> Nueva Persona
                        </button>
                        <button type="button" class="btn" onclick="abrirModalEditar()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #1e293b; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-pencil-simple" style="color: #15803d; font-size: 1.15rem;"></i> Modificar
                        </button>
                        <button type="button" class="btn" onclick="eliminarRegistro()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #ef4444; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-trash" style="font-size: 1.15rem;"></i> Eliminar
                        </button>
                    </div>

                    <div style="position: relative; width: 280px;">
                        <input type="text" id="searchInput" class="form-control" placeholder="BUSCAR PERSONA..." onkeyup="filtrarRegistros()" style="padding-right: 36px; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; border-radius: 8px; border: 1px solid #cbd5e1; background: #fafafa;">
                        <i class="ph ph-magnifying-glass" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #16a34a;"></i>
                    </div>
                </div>

                <div style="overflow-x: auto;">
                    <table class="table table-hover align-middle m-0" style="font-size: 0.88rem;">
                        <thead style="background: #f1f5f9; color: #475569; font-weight: 800; text-transform: uppercase; font-size: 0.76rem;">
                            <tr>
                                <th style="padding: 14px 20px;">Código</th>
                                <th style="padding: 14px 20px;">Nombre / Razón Social</th>
                                <th style="padding: 14px 20px;">Tipo & N° Documento</th>
                                <th style="padding: 14px 20px;">Teléfono</th>
                                <th style="padding: 14px 20px;">Email</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody">
                            <tr><td colspan="5" class="text-center py-4 text-muted">Cargando personas...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- PERFECT CENTERED MODAL OVERLAY -->
    <div id="modalOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; border-radius: 14px; border: 1px solid #cbd5e1; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); width: 100%; max-width: 650px; overflow: hidden; animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);">
            
            <!-- Modal Header -->
            <div style="padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #16a34a, #15803d); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.15rem;">
                        <i class="ph ph-user-gear"></i>
                    </div>
                    <h4 id="modalTitle" style="margin: 0; font-size: 1.05rem; font-weight: 800; color: #0f172a;">Nueva Persona (PERSONAS)</h4>
                </div>
                <button type="button" class="btn-close" onclick="cerrarModal()" style="font-size: 0.9rem; cursor: pointer;"></button>
            </div>

            <!-- Modal Form Body -->
            <div style="padding: 24px 28px;">
                <form id="formPersona" onsubmit="event.preventDefault(); guardarRegistro();">
                    <input type="hidden" id="codPersona">
                    
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Nombre o Razón Social :</label>
                        <input type="text" id="nombre" class="form-control" placeholder="EJ: JUAN PÉREZ / CONTA S.A." required style="border-radius: 8px; font-weight: 700;">
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Tipo Documento :</label>
                            <select id="tipoDocumento" class="form-select" onchange="onTipoDocumentoChange()" style="border-radius: 8px; font-weight: 700;">
                                <option value="RUC">RUC (Paraguay)</option>
                                <option value="CI">C.I. (Cédula)</option>
                                <option value="PASAPORTE">Pasaporte / Doc. Extranjero</option>
                                <option value="INNOMINADO">Sin Doc. / Consumidor Final</option>
                            </select>
                        </div>
                        <div class="col-md-7">
                            <label id="lblRuc" class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">N° Documento / RUC :</label>
                            <input type="text" id="ruc" class="form-control" placeholder="EJ: 80012345-6" style="border-radius: 8px; font-weight: 600;">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Dirección :</label>
                        <input type="text" id="direccion" class="form-control" placeholder="EJ: CALLE PALMA 456" style="border-radius: 8px;">
                    </div>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Teléfono :</label>
                            <input type="text" id="telefono" class="form-control" placeholder="EJ: 021 445566" style="border-radius: 8px;">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Email :</label>
                            <input type="email" id="email" class="form-control" placeholder="EJ: persona@empresa.com.py" style="border-radius: 8px;">
                        </div>
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div style="padding: 14px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn" onclick="cerrarModal()" style="background: white; border: 1px solid #cbd5e1; color: #334155; font-weight: 700; border-radius: 8px; padding: 7px 18px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;"><i class="ph ph-x" style="font-size: 0.95rem;"></i> Cancelar</button>
                <button type="button" class="btn" onclick="guardarRegistro()" style="background: #16a34a; border: none; color: white; font-weight: 700; border-radius: 8px; padding: 7px 22px; font-size: 0.85rem;">Guardar</button>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        let listData = [];
        let selectedId = null;

        document.addEventListener('DOMContentLoaded', cargarRegistros);

        function onTipoDocumentoChange() {
            const tipo = document.getElementById('tipoDocumento').value;
            const lbl = document.getElementById('lblRuc');
            const inputRuc = document.getElementById('ruc');

            if (tipo === 'RUC') {
                lbl.innerText = 'N° RUC (con DV) :';
                inputRuc.placeholder = 'EJ: 80012345-6';
            } else if (tipo === 'CI') {
                lbl.innerText = 'Cédula de Identidad (C.I.) :';
                inputRuc.placeholder = 'EJ: 4512389';
            } else if (tipo === 'PASAPORTE') {
                lbl.innerText = 'Pasaporte / DNI Extranjero :';
                inputRuc.placeholder = 'EJ: PA-9876543';
            } else if (tipo === 'INNOMINADO') {
                lbl.innerText = 'Documento Innominado :';
                inputRuc.placeholder = '44444401-7';
                if (!inputRuc.value) inputRuc.value = '44444401-7';
            }
        }

        function cargarRegistros() {
            fetch('/api/co_personas/list')
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        listData = res.data || [];
                        renderTabla(listData);
                    }
                });
        }

        function renderTabla(data) {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No se encontraron registros.</td></tr>';
                return;
            }
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                if (selectedId && selectedId == item.COD_PERSONA) tr.classList.add('selected-row');
                tr.onclick = function() {
                    document.querySelectorAll('#tablaBody tr').forEach(r => r.classList.remove('selected-row'));
                    tr.classList.add('selected-row');
                    selectedId = item.COD_PERSONA;
                };
                tr.ondblclick = abrirModalEditar;

                let tipoBadge = `<span class="badge bg-secondary text-white me-1" style="font-size:0.75rem;">${item.TIPO_DOCUMENTO || 'RUC'}</span>`;
                if (item.TIPO_DOCUMENTO === 'RUC') tipoBadge = `<span class="badge bg-primary text-white me-1" style="font-size:0.75rem;">RUC</span>`;
                else if (item.TIPO_DOCUMENTO === 'CI') tipoBadge = `<span class="badge bg-info text-white me-1" style="font-size:0.75rem;">C.I.</span>`;
                else if (item.TIPO_DOCUMENTO === 'PASAPORTE') tipoBadge = `<span class="badge bg-warning text-dark me-1" style="font-size:0.75rem;">DOC. EXT</span>`;
                else if (item.TIPO_DOCUMENTO === 'INNOMINADO') tipoBadge = `<span class="badge bg-secondary text-white me-1" style="font-size:0.75rem;">INNOMINADO</span>`;

                let docNum = item.RUC || item.CI || '-';

                tr.innerHTML = `
                    <td class="fw-bold text-primary" style="padding: 12px 20px;"><span class="badge bg-light text-primary border" style="font-size:0.85rem; padding: 4px 8px;">${item.COD_PERSONA || ''}</span></td>
                    <td style="padding: 12px 20px; font-weight: 700; color: #1e293b;">${item.NOMBRE || ''}</td>
                    <td style="padding: 12px 20px;">${tipoBadge} <span class="fw-bold">${docNum}</span></td>
                    <td style="padding: 12px 20px;">${item.TELEFONO || '-'}</td>
                    <td style="padding: 12px 20px;">${item.EMAIL || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarRegistros() {
            const query = document.getElementById('searchInput').value.trim().toUpperCase();
            if (!query) return renderTabla(listData);
            renderTabla(listData.filter(i => (i.NOMBRE && i.NOMBRE.toUpperCase().includes(query)) || (i.COD_PERSONA && i.COD_PERSONA.includes(query))));
        }

        function abrirModalNuevo() {
            document.getElementById('formPersona').reset();
            document.getElementById('codPersona').value = '';
            document.getElementById('tipoDocumento').value = 'RUC';
            onTipoDocumentoChange();
            document.getElementById('modalTitle').innerText = 'Nueva Persona (PERSONAS)';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function abrirModalEditar() {
            if (!selectedId) return Swal.fire('Atención', 'Seleccione un registro.', 'warning');
            const item = listData.find(x => x.COD_PERSONA == selectedId);
            if (!item) return;
            document.getElementById('codPersona').value = item.COD_PERSONA;
            document.getElementById('nombre').value = item.NOMBRE || '';
            document.getElementById('tipoDocumento').value = item.TIPO_DOCUMENTO || 'RUC';
            onTipoDocumentoChange();
            document.getElementById('ruc').value = item.RUC || item.CI || '';
            document.getElementById('direccion').value = item.DIRECCION || '';
            document.getElementById('telefono').value = item.TELEFONO || '';
            document.getElementById('email').value = item.EMAIL || '';
            document.getElementById('modalTitle').innerText = 'Modificar Persona #' + item.COD_PERSONA;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function guardarRegistro() {
            const nombre = document.getElementById('nombre').value.trim();
            if (!nombre) return Swal.fire('Atención', 'El nombre es obligatorio.', 'warning');

            const payload = {
                codPersona: document.getElementById('codPersona').value,
                nombre: nombre,
                tipoDocumento: document.getElementById('tipoDocumento').value,
                ruc: document.getElementById('ruc').value,
                ci: (document.getElementById('tipoDocumento').value === 'CI') ? document.getElementById('ruc').value : '',
                direccion: document.getElementById('direccion').value,
                telefono: document.getElementById('telefono').value,
                email: document.getElementById('email').value
            };

            fetch('/api/co_personas/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    Swal.fire('¡Éxito!', data.message, 'success');
                    cerrarModal();
                    cargarRegistros();
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            });
        }

        function eliminarRegistro() {
            if (!selectedId) return Swal.fire('Atención', 'Seleccione un registro.', 'warning');
            Swal.fire({
                title: '¿Eliminar persona?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444'
            }).then(r => {
                if (r.isConfirmed) {
                    fetch('/api/co_personas/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ codPersona: selectedId })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            Swal.fire('Eliminado', data.message, 'success');
                            selectedId = null;
                            cargarRegistros();
                        } else {
                            Swal.fire({ icon: 'error', title: 'No se puede eliminar', html: data.message, confirmButtonColor: '#16a34a' });
                        }
                    });
                }
            });
        }
    </script>
</body>
</html>
