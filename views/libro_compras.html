<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contabilidad - Libro Compras')}">
</head>
<body style="background-color: #f1f5f9; color: #1e293b;">

    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <div th:replace="~{fragments/layout :: navbar('Libro Compras')}"></div>

        <div class="content-area" style="padding: 1.5rem;">

            <!-- Filter Toolbar Card -->
            <div class="card no-print" style="height: auto !important; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; margin-bottom: 1.5rem; overflow: hidden;">
                <div style="padding: 1.15rem 1.5rem; border-bottom: 1px solid #f1f5f9; background: #ffffff; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <div style="width: 40px; height: 40px; border-radius: 10px; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
                            <i class="ph ph-shopping-cart"></i>
                        </div>
                        <div>
                            <h3 style="margin: 0; font-size: 1.15rem; font-weight: 800; color: #0f172a;">Libro de Compras</h3>
                            <p style="margin: 0; font-size: 0.8rem; color: #64748b; font-weight: 500;">Módulo Contabilidad - Reporte de Comprobantes de Compras / Egresos</p>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button type="button" onclick="imprimirReporte()" style="background: #0284c7; color: white; border: none; padding: 0.55rem 1.25rem; border-radius: 10px; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);" onmouseover="this.style.background='#0369a1'" onmouseout="this.style.background='#0284c7'">
                            <i class="ph ph-printer-bold" style="font-size: 1.1rem;"></i> Imprimir Libro Compras
                        </button>
                    </div>
                </div>

                <!-- Form Controls -->
                <div style="padding: 1.15rem 1.5rem; background: #fafafa;">
                    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 1rem;">
                        <span style="font-size: 0.72rem; font-weight: 800; color: #475569; text-transform: uppercase; margin-right: 4px;">
                            <i class="ph ph-lightning" style="color:#16a34a;"></i> Rápido · Ejercicio <span th:text="${ejercicio}">2026</span>:
                        </span>
                        <button type="button" class="qf-btn" data-qf="hoy">Hoy</button>
                        <button type="button" class="qf-btn" data-qf="ayer">Ayer</button>
                        <button type="button" class="qf-btn" data-qf="mes">Este mes</button>
                        <button type="button" class="qf-btn" data-qf="mesAnt">Mes anterior</button>
                        <button type="button" class="qf-btn" data-qf="trim">Trimestre</button>
                        <button type="button" class="qf-btn" data-qf="anio">Todo el ejercicio</button>
                        <span style="width:1px; height:22px; background:#cbd5e1; margin: 0 6px;"></span>
                        <span id="qfMeses" style="display:flex; flex-wrap:wrap; gap:4px;"></span>
                    </div>
                    <form id="filterForm" onsubmit="event.preventDefault(); cargarLibroCompras();" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)) 120px; gap: 1rem; align-items: flex-end;">
                        <div>
                            <label style="display: block; font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 0.35rem;">Fecha Desde</label>
                            <input type="date" id="fechaDesde" th:value="${defFechaDesde}" th:min="${ejerInicio}" th:max="${ejerFinal}" class="form-control" style="height: 42px; border-radius: 8px; font-weight: 600;">
                        </div>

                        <div>
                            <label style="display: block; font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 0.35rem;">Fecha Hasta</label>
                            <input type="date" id="fechaHasta" th:value="${defFechaHasta}" th:min="${ejerInicio}" th:max="${ejerFinal}" class="form-control" style="height: 42px; border-radius: 8px; font-weight: 600;">
                        </div>

                        <div>
                            <label style="display: block; font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 0.35rem;">Proveedor / Razón Social</label>
                            <input type="text" id="codProveedor" placeholder="Buscar proveedor..." class="form-control" style="height: 42px; border-radius: 8px; font-weight: 600;">
                        </div>

                        <div>
                            <label style="display: block; font-size: 0.75rem; font-weight: 800; color: #475569; text-transform: uppercase; margin-bottom: 0.35rem;">Condición</label>
                            <select id="condicion" class="form-control" style="height: 42px; border-radius: 8px; font-weight: 600;">
                                <option value="TODOS">TODAS</option>
                                <option value="CON">CONTADO (CON)</option>
                                <option value="CRE">CRÉDITO (CRE)</option>
                            </select>
                        </div>

                        <div style="display: flex; align-items: center; gap: 8px; height: 42px; padding-bottom: 4px;">
                            <input type="checkbox" id="incluirAnulados" style="width: 18px; height: 18px; accent-color: #0284c7; cursor: pointer;">
                            <label for="incluirAnulados" style="font-size: 0.82rem; font-weight: 700; color: #334155; cursor: pointer; margin: 0;">Anuladas</label>
                        </div>

                        <div>
                            <button type="submit" style="width: 100%; height: 42px; background: #0f172a; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
                                <i class="ph ph-magnifying-glass"></i> Filtrar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Contenedor de Hojas del Reporte Libro Compras (Diseño Oficial) -->
            <div id="libroComprasPagesContainer">
                <div class="lc-sheet">
                    <div style="text-align: center; padding: 3rem; color: #64748b;">
                        <i class="ph ph-spinner" style="font-size: 1.6rem; display: inline-block; animation: spin 1s linear infinite;"></i>
                        <div style="margin-top: 8px; font-weight: 600;">Cargando Libro de Compras...</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .qf-btn { background: #fff; border: 1px solid #cbd5e1; color: #334155; font-size: 0.76rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; cursor: pointer; transition: all .15s; }
        .qf-btn:hover:not(:disabled) { border-color: #16a34a; color: #15803d; background: #f0fdf4; }
        .qf-btn.active { background: #16a34a; border-color: #16a34a; color: #fff; }
        .qf-btn:disabled { opacity: .4; cursor: not-allowed; }
        .qf-mes { padding: 4px 8px; min-width: 40px; }

        /* Hoja estilo documento impreso */
        .lc-sheet {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
            padding: 26px 30px 32px 30px;
            margin: 0 auto 24px auto;
            max-width: 1260px;
            font-family: Arial, Helvetica, sans-serif;
            color: #000000;
            overflow-x: auto;
        }
        .lc-title {
            text-align: center;
            font-size: 20px;
            font-weight: 400;
            letter-spacing: 0.4px;
            margin: 0 0 3px 0;
            color: #000000;
            text-transform: uppercase;
        }
        .lc-subtitle {
            text-align: center;
            font-size: 12px;
            font-weight: 400;
            margin: 0 0 14px 0;
            color: #000000;
            text-transform: uppercase;
        }
        .lc-hdr-row {
            display: grid;
            grid-template-columns: 3.6fr 1.6fr 2.1fr 3.2fr;
            gap: 14px;
            margin-bottom: 14px;
            align-items: end;
        }
        .lc-box-label {
            font-size: 10.5px;
            color: #000000;
            margin-bottom: 3px;
            padding-left: 2px;
        }
        .lc-box-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #000000;
            table-layout: fixed;
            font-size: 10px;
        }
        .lc-box-table th {
            border-bottom: 1px solid #000000;
            border-right: 1px solid #000000;
            padding: 3px 5px;
            text-align: center;
            font-weight: 400;
            background: #ffffff;
            color: #000000;
            text-transform: uppercase;
        }
        .lc-box-table th:last-child {
            border-right: none;
        }
        .lc-box-table td {
            border-right: 1px solid #000000;
            padding: 3px 6px;
            height: 20px;
            color: #000000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lc-box-table td:last-child {
            border-right: none;
        }

        /* Tabla principal del Libro Compras */
        .lc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10.5px;
            color: #000000;
        }
        .lc-table thead th {
            background: #e5e7eb;
            border: 1px solid #000000;
            padding: 4px 5px;
            text-align: center;
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
            color: #000000;
        }
        .lc-table thead tr:first-child th {
            border-top: 1.5px solid #000000;
        }
        .lc-table thead tr:last-child th {
            border-bottom: 1.5px solid #000000;
        }
        .lc-table thead th:first-child {
            border-left: 1.5px solid #000000;
        }
        .lc-table thead th:last-child {
            border-right: 1.5px solid #000000;
        }
        .lc-table tbody tr.lc-data-row:nth-child(odd) {
            background-color: #ffffff;
        }
        .lc-table tbody tr.lc-data-row:nth-child(even) {
            background-color: #f6eae8;
        }
        .lc-table tbody tr.lc-data-row td {
            padding: 2.5px 5px;
            border: none;
            white-space: nowrap;
        }
        .lc-table tbody tr.lc-row-anulada td {
            text-decoration: line-through;
            color: #7f1d1d;
        }
        /* Fila TRANSPORTE */
        .lc-table tbody tr.lc-transporte-row td {
            border: 1px solid #000000;
            background: #ffffff !important;
            padding: 3px 5px;
            font-size: 10.5px;
        }
        /* Fila TOTAL GENERAL */
        .lc-table tfoot tr.lc-total-row td.lc-total-label {
            border: 1px solid #000000;
            background: #ffffff;
            padding: 4px 6px;
            text-align: left;
            font-weight: 400;
        }
        .lc-table tfoot tr.lc-total-row td.lc-total-val {
            border: 1.5px solid #000000;
            background: #e5e7eb;
            padding: 4px 5px;
            text-align: right;
            font-weight: 700;
        }

        @media print {
            @page {
                size: A4 landscape;
                margin: 8mm;
            }
            .no-print, .app-sidebar, .top-navbar {
                display: none !important;
            }
            .main-content, .content-area {
                margin: 0 !important;
                padding: 0 !important;
            }
            .lc-sheet {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
                page-break-after: always;
            }
            .lc-sheet:last-child {
                page-break-after: auto;
            }
            body {
                background: #ffffff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }
    </style>

    <script th:inline="javascript">
        const EJER_INI = /*[[${ejerInicio}]]*/ '2026-01-01';
        const EJER_FIN = /*[[${ejerFinal}]]*/ '2026-12-31';
        const ROWS_PER_PAGE = 28;

        document.addEventListener('DOMContentLoaded', () => {
            initFiltrosRapidos();
            cargarLibroCompras();
        });

        const pad = n => String(n).padStart(2, '0');
        const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
        const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const clampIso = s => (s < EJER_INI ? EJER_INI : (s > EJER_FIN ? EJER_FIN : s));
        const hoyEnEjercicio = () => parseIso(clampIso(iso(new Date())));

        function fmtDmy(ymd) {
            if (!ymd || ymd.length < 10) return ymd || '';
            return `${ymd.substring(8, 10)}/${ymd.substring(5, 7)}/${ymd.substring(0, 4)}`;
        }

        function escHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function aplicarRango(desde, hasta, btn) {
            document.getElementById('fechaDesde').value = clampIso(iso(desde));
            document.getElementById('fechaHasta').value = clampIso(iso(hasta));
            document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            cargarLibroCompras();
        }

        function initFiltrosRapidos() {
            const y = parseIso(EJER_INI).getFullYear();
            const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
            const cont = document.getElementById('qfMeses');
            meses.forEach((m, i) => {
                const b = document.createElement('button');
                b.type = 'button'; b.className = 'qf-btn qf-mes'; b.textContent = m;
                const ini = new Date(y, i, 1), fin = new Date(y, i + 1, 0);
                if (iso(fin) < EJER_INI || iso(ini) > EJER_FIN) b.disabled = true;
                b.onclick = () => aplicarRango(ini, fin, b);
                cont.appendChild(b);
            });

            document.querySelectorAll('.qf-btn[data-qf]').forEach(b => b.onclick = () => {
                const ref = hoyEnEjercicio();
                let d, h;
                switch (b.dataset.qf) {
                    case 'hoy':    d = h = ref; break;
                    case 'ayer':   d = h = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate() - 1); break;
                    case 'mes':    d = new Date(ref.getFullYear(), ref.getMonth(), 1); h = new Date(ref.getFullYear(), ref.getMonth() + 1, 0); break;
                    case 'mesAnt': d = new Date(ref.getFullYear(), ref.getMonth() - 1, 1); h = new Date(ref.getFullYear(), ref.getMonth(), 0); break;
                    case 'trim':   { const q = Math.floor(ref.getMonth() / 3) * 3; d = new Date(ref.getFullYear(), q, 1); h = new Date(ref.getFullYear(), q + 3, 0); break; }
                    case 'anio':   d = parseIso(EJER_INI); h = parseIso(EJER_FIN); break;
                }
                aplicarRango(d, h, b);
            });

            ['fechaDesde', 'fechaHasta'].forEach(id => {
                document.getElementById(id).addEventListener('change', e => {
                    if (e.target.value) e.target.value = clampIso(e.target.value);
                    document.querySelectorAll('.qf-btn').forEach(b => b.classList.remove('active'));
                });
            });
        }

        function formatGs(val) {
            if (val === null || val === undefined || isNaN(val)) return '0';
            return Math.round(Number(val)).toLocaleString('es-PY');
        }

        function renderHeaderHtml(emp, desdeFmt, hastaFmt) {
            const act = escHtml(emp.actividad || 'IVA & IRP');
            const razon = escHtml(emp.descripcion || '');
            const ruc = escHtml(emp.rucEmpresa || '');
            const rep = escHtml(emp.repLegal || '');
            const contNom = escHtml(emp.nomContador || '');
            const contRuc = escHtml(emp.rucContador || '');

            return `
                <div class="lc-title">LIBRO COMPRAS</div>
                <div class="lc-subtitle">ACTIVIDAD: ${act}</div>

                <div class="lc-hdr-row">
                    <div>
                        <div class="lc-box-label">1. Identificador del Contribuyente</div>
                        <table class="lc-box-table">
                            <thead>
                                <tr>
                                    <th style="width: 72%;">RAZÓN SOCIAL/NOMBRES Y APELLIDOS</th>
                                    <th style="width: 28%;">RUC</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="text-align: left;">${razon}</td>
                                    <td style="text-align: left;">${ruc}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div>
                        <div class="lc-box-label">2. Periodo Fiscal</div>
                        <table class="lc-box-table">
                            <thead>
                                <tr>
                                    <th style="width: 50%;">DESDE</th>
                                    <th style="width: 50%;">HASTA</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="text-align: center;">${escHtml(desdeFmt)}</td>
                                    <td style="text-align: center;">${escHtml(hastaFmt)}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div>
                        <div class="lc-box-label">3. Representante Legal</div>
                        <table class="lc-box-table">
                            <thead>
                                <tr>
                                    <th>NOMBRES Y APELLIDOS</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="text-align: left;">${rep}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div>
                        <div class="lc-box-label">4. Identificador del Contador</div>
                        <table class="lc-box-table">
                            <thead>
                                <tr>
                                    <th style="width: 70%;">NOMBRES Y APELLIDOS</th>
                                    <th style="width: 30%;">RUC</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td style="text-align: left;">${contNom}</td>
                                    <td style="text-align: left;">${contRuc}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderTableHeadHtml() {
            return `
                <thead>
                    <tr>
                        <th rowspan="2" style="width: 5.5%;">DIA-MES</th>
                        <th rowspan="2" style="width: 11%;">DOCUMENTO</th>
                        <th rowspan="2" style="width: 6.5%;">TIMB.</th>
                        <th colspan="3">PROVEEDOR</th>
                        <th rowspan="2" style="width: 4.5%;">COND</th>
                        <th colspan="7">VALORES DE COMPRAS</th>
                    </tr>
                    <tr>
                        <th style="width: 22%;">RAZÓN SOCIAL</th>
                        <th style="width: 6.5%;">RUC</th>
                        <th style="width: 2.5%;">DV</th>
                        <th style="width: 6.5%;">GRAV. 10%</th>
                        <th style="width: 6%;">GRAV. 5%</th>
                        <th style="width: 6%;">IVA 10%</th>
                        <th style="width: 5.5%;">IVA 5%</th>
                        <th style="width: 5.5%;">EXENTAS</th>
                        <th style="width: 5.5%;">BASE IMP.</th>
                        <th style="width: 6.5%;">TOTAL</th>
                    </tr>
                </thead>
            `;
        }

        async function cargarLibroCompras() {
            const fechaDesde = document.getElementById('fechaDesde').value;
            const fechaHasta = document.getElementById('fechaHasta').value;
            const codProveedor = document.getElementById('codProveedor').value;
            const condicion = document.getElementById('condicion').value;
            const incluirAnulados = document.getElementById('incluirAnulados').checked;

            const container = document.getElementById('libroComprasPagesContainer');
            container.innerHTML = `
                <div class="lc-sheet">
                    <div style="text-align: center; padding: 3rem; color: #64748b;">
                        <i class="ph ph-spinner" style="font-size: 1.6rem; display: inline-block; animation: spin 1s linear infinite;"></i>
                        <div style="margin-top: 8px; font-weight: 600;">Cargando libro de compras...</div>
                    </div>
                </div>
            `;

            try {
                const url = `/api/reportes/libro-compras?fechaDesde=${encodeURIComponent(fechaDesde)}&fechaHasta=${encodeURIComponent(fechaHasta)}&codProveedor=${encodeURIComponent(codProveedor)}&condicion=${encodeURIComponent(condicion)}&incluirAnulados=${incluirAnulados}`;
                const resp = await fetch(url);
                const data = await resp.json();

                const records = data.records || [];
                const totales = data.totales || {};
                const emp = data.empresa || {};
                if (data.fechaDesde) document.getElementById('fechaDesde').value = data.fechaDesde;
                if (data.fechaHasta) document.getElementById('fechaHasta').value = data.fechaHasta;

                const desdeFmt = data.fechaDesdeFmt || fmtDmy(data.fechaDesde || fechaDesde);
                const hastaFmt = data.fechaHastaFmt || fmtDmy(data.fechaHasta || fechaHasta);

                if (records.length === 0) {
                    container.innerHTML = `
                        <div class="lc-sheet">
                            ${renderHeaderHtml(emp, desdeFmt, hastaFmt)}
                            <table class="lc-table">
                                ${renderTableHeadHtml()}
                                <tbody>
                                    <tr class="lc-data-row">
                                        <td colspan="14" style="text-align: center; padding: 18px; color: #475569;">No se registraron movimientos de compras en el periodo seleccionado.</td>
                                    </tr>
                                </tbody>
                                <tfoot>
                                    <tr class="lc-total-row">
                                        <td colspan="7" class="lc-total-label">TOTAL GENERAL</td>
                                        <td class="lc-total-val">0</td>
                                        <td class="lc-total-val">0</td>
                                        <td class="lc-total-val">0</td>
                                        <td class="lc-total-val">0</td>
                                        <td class="lc-total-val">0</td>
                                        <td class="lc-total-val">0</td>
                                        <td class="lc-total-val">0</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    `;
                    return;
                }

                // Dividir en páginas y calcular TRANSPORTE acumulado entre páginas
                const chunks = [];
                for (let i = 0; i < records.length; i += ROWS_PER_PAGE) {
                    chunks.push(records.slice(i, i + ROWS_PER_PAGE));
                }

                let acum = { grav10: 0, grav5: 0, iva10: 0, iva5: 0, exentas: 0, baseImp: 0, total: 0 };
                let pagesHtml = '';

                chunks.forEach((chunk, pageIdx) => {
                    const isFirstPage = pageIdx === 0;
                    const isLastPage = pageIdx === chunks.length - 1;

                    let transporteHtml = '';
                    if (!isFirstPage) {
                        transporteHtml = `
                            <tr class="lc-transporte-row">
                                <td colspan="7" style="text-align: left;">TRANSPORTE</td>
                                <td style="text-align: right;">${formatGs(acum.grav10)}</td>
                                <td style="text-align: right;">${formatGs(acum.grav5)}</td>
                                <td style="text-align: right;">${formatGs(acum.iva10)}</td>
                                <td style="text-align: right;">${formatGs(acum.iva5)}</td>
                                <td style="text-align: right;">${formatGs(acum.exentas)}</td>
                                <td style="text-align: right;">${formatGs(acum.baseImp)}</td>
                                <td style="text-align: right;">${formatGs(acum.total)}</td>
                            </tr>
                        `;
                    }

                    let rowsHtml = '';
                    chunk.forEach(r => {
                        if (!r.anulada) {
                            acum.grav10  += Number(r.grav10 || 0);
                            acum.grav5   += Number(r.grav5 || 0);
                            acum.iva10   += Number(r.iva10 || 0);
                            acum.iva5    += Number(r.iva5 || 0);
                            acum.exentas += Number(r.exentas || 0);
                            acum.baseImp += Number(r.baseImp || 0);
                            acum.total   += Number(r.total || 0);
                        }

                        const clsAnulada = r.anulada ? ' lc-row-anulada' : '';
                        rowsHtml += `
                            <tr class="lc-data-row${clsAnulada}">
                                <td style="text-align: center;">${escHtml(r.diaMes)}</td>
                                <td style="text-align: center;">${escHtml(r.documento)}</td>
                                <td style="text-align: center;">${escHtml(r.timbrado)}</td>
                                <td style="text-align: left;">${escHtml(r.razonSocial)}</td>
                                <td style="text-align: left;">${escHtml(r.rucNum)}</td>
                                <td style="text-align: center;">${escHtml(r.rucDv)}</td>
                                <td style="text-align: center;">${escHtml(r.condicion)}</td>
                                <td style="text-align: right;">${formatGs(r.grav10)}</td>
                                <td style="text-align: right;">${formatGs(r.grav5)}</td>
                                <td style="text-align: right;">${formatGs(r.iva10)}</td>
                                <td style="text-align: right;">${formatGs(r.iva5)}</td>
                                <td style="text-align: right;">${formatGs(r.exentas)}</td>
                                <td style="text-align: right;">${formatGs(r.baseImp)}</td>
                                <td style="text-align: right;">${formatGs(r.total)}</td>
                            </tr>
                        `;
                    });

                    let footHtml = '';
                    if (isLastPage) {
                        footHtml = `
                            <tfoot>
                                <tr class="lc-total-row">
                                    <td colspan="7" class="lc-total-label">TOTAL GENERAL</td>
                                    <td class="lc-total-val">${formatGs(totales.grav10)}</td>
                                    <td class="lc-total-val">${formatGs(totales.grav5)}</td>
                                    <td class="lc-total-val">${formatGs(totales.iva10)}</td>
                                    <td class="lc-total-val">${formatGs(totales.iva5)}</td>
                                    <td class="lc-total-val">${formatGs(totales.exentas)}</td>
                                    <td class="lc-total-val">${formatGs(totales.baseImp)}</td>
                                    <td class="lc-total-val">${formatGs(totales.total)}</td>
                                </tr>
                            </tfoot>
                        `;
                    }

                    pagesHtml += `
                        <div class="lc-sheet">
                            ${renderHeaderHtml(emp, desdeFmt, hastaFmt)}
                            <table class="lc-table">
                                ${renderTableHeadHtml()}
                                <tbody>
                                    ${transporteHtml}
                                    ${rowsHtml}
                                </tbody>
                                ${footHtml}
                            </table>
                        </div>
                    `;
                });

                container.innerHTML = pagesHtml;

            } catch (e) {
                console.error(e);
                container.innerHTML = `
                    <div class="lc-sheet">
                        <div style="text-align: center; padding: 2rem; color: #ef4444;">Error al cargar el libro de compras.</div>
                    </div>
                `;
            }
        }

        function imprimirReporte() {
            const fechaDesde = document.getElementById('fechaDesde').value;
            const fechaHasta = document.getElementById('fechaHasta').value;
            const codProveedor = document.getElementById('codProveedor').value;
            const condicion = document.getElementById('condicion').value;
            const incluirAnulados = document.getElementById('incluirAnulados').checked;

            const url = `/app/libro-compras/print?fechaDesde=${encodeURIComponent(fechaDesde)}&fechaHasta=${encodeURIComponent(fechaHasta)}&codProveedor=${encodeURIComponent(codProveedor)}&condicion=${encodeURIComponent(condicion)}&incluirAnulados=${incluirAnulados}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
