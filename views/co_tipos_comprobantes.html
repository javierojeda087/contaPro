<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tipos de Comprobantes (CO_TIPOS_COMPROBANTES) - Sistema Contable')}">
</head>
<style>
    .swal2-container {
        z-index: 3000 !important;
    }
    .selected-row {
        background-color: #bbf7d0 !important;
        border-left: 6px solid #16a34a !important;
    }
    .selected-row td {
        background-color: #bbf7d0 !important;
        color: #0f172a !important;
    }
    tr.selected-row:hover td {
        background-color: #86efac !important;
    }
</style>
<body style="background: var(--bg-color);">

    <!-- Left Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Navbar -->
        <div th:replace="~{fragments/layout :: navbar('Tipos de Comprobantes')}"></div>

        <div class="content-area">
            
            <div style="background: white; border-radius: 14px; border: 1px solid #cbd5e1; box-shadow: 0 8px 25px rgba(0,0,0,0.06); overflow: hidden; width: 100%;">
                
                <!-- Table Header Toolbar -->
                <div style="padding: 14px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <button type="button" class="btn" onclick="abrirModalNuevo()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #1e293b; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-plus-circle" style="color: #16a34a; font-size: 1.15rem;"></i> Nuevo Comprobante
                        </button>
                        <button type="button" class="btn" onclick="abrirModalEditar()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #1e293b; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-pencil-simple" style="color: #15803d; font-size: 1.15rem;"></i> Modificar
                        </button>
                        <button type="button" class="btn" onclick="eliminarRegistro()" style="background: white; border: 1px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #ef4444; padding: 7px 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-trash" style="font-size: 1.15rem;"></i> Eliminar
                        </button>
                    </div>

                    <div style="position: relative; width: 300px;">
                        <input type="text" id="searchInput" class="form-control" placeholder="BUSCAR COMPROBANTE..." onkeyup="filtrarRegistros()" style="padding-right: 36px; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; border-radius: 8px; border: 1px solid #cbd5e1; background: #fafafa;">
                        <i class="ph ph-magnifying-glass" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #16a34a;"></i>
                    </div>
                </div>

                <!-- Table Content -->
                <div style="overflow-x: auto;">
                    <table class="table table-hover align-middle m-0" style="font-size: 0.88rem;">
                        <thead style="background: #f1f5f9; color: #475569; font-weight: 800; text-transform: uppercase; font-size: 0.76rem;">
                            <tr>
                                <th style="padding: 14px 20px;">Tipo Comprobante</th>
                                <th style="padding: 14px 20px;">Descripción</th>
                                <th style="padding: 14px 20px;">Módulo Afectado</th>
                                <th style="padding: 14px 20px; text-align: center;">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaBody">
                            <tr><td colspan="4" class="text-center py-4 text-muted">Cargando tipos de comprobantes...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- PERFECT CENTERED MODAL OVERLAY -->
    <div id="modalOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: white; border-radius: 14px; border: 1px solid #cbd5e1; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); width: 100%; max-width: 550px; overflow: hidden; animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);">
            
            <!-- Modal Header -->
            <div style="padding: 16px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #16a34a, #15803d); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.15rem;">
                        <i class="ph ph-receipt"></i>
                    </div>
                    <h4 id="modalTitle" style="margin: 0; font-size: 1.05rem; font-weight: 800; color: #0f172a;">Nuevo Tipo de Comprobante</h4>
                </div>
                <button type="button" class="btn-close" onclick="cerrarModal()" style="font-size: 0.9rem; cursor: pointer;"></button>
            </div>

            <!-- Modal Form Body -->
            <div style="padding: 24px 28px;">
                <form id="formComprobante" onsubmit="event.preventDefault(); guardarRegistro();">
                    <input type="hidden" id="isEdit" value="false">
                    
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Tipo / Nombre de Comprobante :</label>
                        <input type="text" id="tipComprobante" class="form-control" placeholder="EJ: Factura, Nota de Crédito, Ticket" required style="border-radius: 8px; font-weight: 700;">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Descripción Completa :</label>
                        <input type="text" id="descripcion" class="form-control" placeholder="EJ: Factura de Venta / Compra" style="border-radius: 8px;">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Tipo de Comprobante :</label>
                        <select id="tipo" class="form-select" style="border-radius: 8px; font-weight: 700;">
                            <option value="AMBOS" selected>AMBOS (Ingresos y Egresos)</option>
                            <option value="INGRESOS">INGRESOS (Ventas / Facturación)</option>
                            <option value="EGRESOS">EGRESOS (Compras / Gastos)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" style="font-weight: 700; color: #475569; font-size: 0.83rem;">Módulo del Sistema (Tabla MODULOS) :</label>
                        <select id="codModulo" class="form-select" style="border-radius: 8px; font-weight: 700;">
                            <option value="AMBOS">AMBOS (Todos los módulos)</option>
                        </select>
                    </div>
                </form>
            </div>

            <!-- Modal Footer -->
            <div style="padding: 14px 24px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 12px;">
                <button type="button" class="btn" onclick="cerrarModal()" style="background: white; border: 1px solid #cbd5e1; color: #334155; font-weight: 700; border-radius: 8px; padding: 7px 18px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;"><i class="ph ph-x" style="font-size: 0.95rem;"></i> Cancelar</button>
                <button type="button" class="btn" onclick="guardarRegistro()" style="background: #16a34a; border: none; color: white; font-weight: 700; border-radius: 8px; padding: 7px 22px; font-size: 0.85rem; display: flex; align-items: center; gap: 6px;">
                    <i class="ph ph-check-bold"></i> Guardar
                </button>
            </div>
        </div>
    </div>

    <!-- Layout Scripts -->
    <div th:replace="~{fragments/layout :: scripts}"></div>

    <script>
        let listData = [];
        let modulosList = [];
        let selectedKey = null;

        document.addEventListener('DOMContentLoaded', async function() {
            await cargarModulos();
            cargarRegistros();
        });

        async function cargarModulos() {
            try {
                const res = await fetch('/api/co_tipos_comprobantes/modulos');
                const data = await res.json();
                modulosList = data || [];
                const sel = document.getElementById('codModulo');
                sel.innerHTML = '<option value="AMBOS">AMBOS (Todos los módulos)</option>';
                modulosList.forEach(m => {
                    const code = m.COD_MODULO || m.cod_modulo;
                    const desc = m.DESCRIPCION || m.descripcion || code;
                    const opt = document.createElement('option');
                    opt.value = code;
                    opt.textContent = `${code} - ${desc}`;
                    sel.appendChild(opt);
                });
            } catch (e) {
                console.warn('Error al cargar módulos:', e);
            }
        }

        function cargarRegistros() {
            fetch('/api/co_tipos_comprobantes/list')
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        listData = res.data || [];
                        renderTabla(listData);
                    }
                })
                .catch(err => {
                    console.error('Error al cargar tipos de comprobantes:', err);
                });
        }

        function renderTabla(data) {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No se encontraron comprobantes registrados.</td></tr>';
                return;
            }
            data.forEach(item => {
                const key = item.TIP_COMPROBANTE || item.tip_comprobante;
                const desc = item.DESCRIPCION || item.descripcion || key;
                const tipoVal = item.TIPO || item.tipo || item.COD_MODULO || 'AMBOS';
                const modVal = item.COD_MODULO || item.cod_modulo || 'AMBOS';
                const est = item.ESTADO || item.estado || 'A';

                const tr = document.createElement('tr');
                tr.style.cursor = 'pointer';
                if (selectedKey && selectedKey === key) {
                    tr.classList.add('selected-row');
                }

                tr.onclick = function() {
                    document.querySelectorAll('#tablaBody tr').forEach(r => r.classList.remove('selected-row'));
                    tr.classList.add('selected-row');
                    selectedKey = key;
                };
                tr.ondblclick = abrirModalEditar;

                let tipoBadge = `<span class="badge bg-success text-white" style="font-size:0.78rem;">AMBOS</span>`;
                if (tipoVal.toUpperCase() === 'INGRESOS') {
                    tipoBadge = `<span class="badge bg-primary text-white" style="font-size:0.78rem;">INGRESOS</span>`;
                } else if (tipoVal.toUpperCase() === 'EGRESOS') {
                    tipoBadge = `<span class="badge bg-warning text-dark" style="font-size:0.78rem;">EGRESOS</span>`;
                }

                let estBadge = (est === 'A') ? `<span class="badge bg-success text-white">ACTIVO</span>` : `<span class="badge bg-secondary">INACTIVO</span>`;

                tr.innerHTML = `
                    <td class="fw-bold text-primary" style="padding: 12px 20px;"><span class="badge bg-light text-primary border" style="font-size:0.85rem; padding: 6px 10px;">${key}</span></td>
                    <td style="padding: 12px 20px; font-weight: 700; color: #1e293b;">${desc}</td>
                    <td style="padding: 12px 20px;">${tipoBadge} <small class="text-muted ms-1">(${modVal})</small></td>
                    <td style="padding: 12px 20px; text-align: center;">${estBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarRegistros() {
            const query = document.getElementById('searchInput').value.trim().toUpperCase();
            if (!query) {
                renderTabla(listData);
                return;
            }
            const filtrados = listData.filter(item => {
                const key = (item.TIP_COMPROBANTE || item.tip_comprobante || '').toUpperCase();
                const desc = (item.DESCRIPCION || item.descripcion || '').toUpperCase();
                const tipoVal = (item.TIPO || item.tipo || '').toUpperCase();
                const mod = (item.COD_MODULO || item.cod_modulo || '').toUpperCase();
                return key.includes(query) || desc.includes(query) || tipoVal.includes(query) || mod.includes(query);
            });
            renderTabla(filtrados);
        }

        function abrirModalNuevo() {
            document.getElementById('isEdit').value = 'false';
            document.getElementById('modalTitle').innerText = 'Nuevo Tipo de Comprobante';
            document.getElementById('tipComprobante').value = '';
            document.getElementById('tipComprobante').readOnly = false;
            document.getElementById('descripcion').value = '';
            document.getElementById('tipo').value = 'AMBOS';
            document.getElementById('codModulo').value = 'AMBOS';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function abrirModalEditar() {
            if (!selectedKey) {
                Swal.fire('Atención', 'Seleccione un tipo de comprobante de la lista para modificar.', 'warning');
                return;
            }
            const item = listData.find(i => (i.TIP_COMPROBANTE || i.tip_comprobante) === selectedKey);
            if (!item) return;

            document.getElementById('isEdit').value = 'true';
            document.getElementById('modalTitle').innerText = 'Editar Tipo de Comprobante';
            document.getElementById('tipComprobante').value = item.TIP_COMPROBANTE || item.tip_comprobante || '';
            document.getElementById('tipComprobante').readOnly = true;
            document.getElementById('descripcion').value = item.DESCRIPCION || item.descripcion || '';
            document.getElementById('tipo').value = item.TIPO || item.tipo || 'AMBOS';
            document.getElementById('codModulo').value = item.COD_MODULO || item.cod_modulo || 'AMBOS';

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        function guardarRegistro() {
            const tipComprobante = document.getElementById('tipComprobante').value.trim();
            const descripcion = document.getElementById('descripcion').value.trim() || tipComprobante;
            const tipo = document.getElementById('tipo').value;
            const codModulo = document.getElementById('codModulo').value.trim();

            if (!tipComprobante) {
                Swal.fire('Atención', 'El tipo de comprobante es obligatorio.', 'warning');
                return;
            }

            const payload = {
                tipComprobante: tipComprobante,
                descripcion: descripcion,
                tipo: tipo,
                codModulo: codModulo
            };

            fetch('/api/co_tipos_comprobantes/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'success') {
                    cerrarModal();
                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: res.message,
                        confirmButtonColor: '#16a34a'
                    }).then(() => {
                        cargarRegistros();
                    });
                } else {
                    Swal.fire('Error', res.message, 'error');
                }
            })
            .catch(err => {
                Swal.fire('Error', 'No se pudo guardar el tipo de comprobante.', 'error');
            });
        }

        function eliminarRegistro() {
            if (!selectedKey) {
                Swal.fire('Atención', 'Seleccione un tipo de comprobante para eliminar.', 'warning');
                return;
            }

            const targetKey = selectedKey;

            Swal.fire({
                title: '¿Está seguro?',
                text: `Se eliminará el tipo de comprobante '${targetKey}'.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    fetch('/api/co_tipos_comprobantes/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ tipComprobante: targetKey })
                    })
                    .then(res => res.json())
                    .then(res => {
                        if (res.status === 'success') {
                            Swal.fire({
                                icon: 'success',
                                title: 'Eliminado',
                                text: res.message,
                                confirmButtonColor: '#16a34a'
                            }).then(() => {
                                selectedKey = null;
                                cargarRegistros();
                            });
                        } else {
                            Swal.fire('Error', res.message, 'error');
                        }
                    })
                    .catch(err => {
                        Swal.fire('Error', 'No se pudo eliminar el tipo de comprobante.', 'error');
                    });
                }
            });
        }
    </script>
</body>
</html>
