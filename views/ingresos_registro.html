                input: 'text',
                inputLabel: 'Ingrese RUC o Cédula:',
                inputPlaceholder: 'Ej: 80012345-6 o 5567097-0',
                showCancelButton: true,
                confirmButtonText: 'Verificar / Buscar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#16a34a'
            });

            if (rucInput) {
                document.getElementById('rucCliente').value = rucInput;
                await verificarYCrearClienteIngreso(true);
            }
        }

        function validarFechasComprobanteVencimiento() {
            const elFec = document.getElementById('fecIngreso');
            const elVenc = document.getElementById('vencTimbrado');
            if (!elFec || !elVenc) return true;
            const fecIngresoVal = (elFec.value || '').trim();
            const vencTimbradoVal = (elVenc.value || '').trim();

            if (fecIngresoVal && vencTimbradoVal && fecIngresoVal > vencTimbradoVal) {
                elFec.style.border = '2px solid #dc2626';
                elFec.style.backgroundColor = '#fef2f2';
                elVenc.style.border = '2px solid #dc2626';
                elVenc.style.backgroundColor = '#fef2f2';
                return false;
            } else {
                if (elFec.style.borderColor === 'rgb(220, 38, 38)' || (elFec.style.border && elFec.style.border.includes('2626'))) {
                    elFec.style.border = '1.5px solid #cbd5e1';
                    elFec.style.backgroundColor = '#ffffff';
                }
                if (elVenc.style.borderColor === 'rgb(220, 38, 38)' || (elVenc.style.border && elVenc.style.border.includes('2626'))) {
                    elVenc.style.border = '1.5px solid #cbd5e1';
                    elVenc.style.backgroundColor = '#f8fafc';
                }
                return true;
            }
        }

        function validarCamposObligatoriosIngreso() {
            let missingFields = [];
            let firstInvalidEl = null;

            function checkField(id, name, isInvalidCondition = null) {
                const el = document.getElementById(id);
                if (!el) return;
                const val = (el.value || '').trim();
                const invalid = isInvalidCondition ? isInvalidCondition(val) : (!val);

                if (invalid) {
                    el.style.border = '2px solid #dc2626';
                    el.style.backgroundColor = '#fef2f2';
                    missingFields.push(name);
                    if (!firstInvalidEl) firstInvalidEl = el;
                } else {
                    el.style.border = '1.5px solid #cbd5e1';
                    el.style.backgroundColor = (id === 'nomCliente' || id === 'vencTimbrado') ? '#f8fafc' : '#ffffff';
                }
            }

            checkField('tipDoc', 'Tipo de Comprobante');
            checkField('nroTimbrado', 'Número de Timbrado', v => !v || v.includes('No hay'));
            checkField('facNro', 'Número de Factura');
            checkField('rucCliente', 'RUC de Cliente');
            checkField('nomCliente', 'Nombre / Razón Social del Cliente');
            checkField('fecIngreso', 'Fecha del Ingreso');

            if (missingFields.length > 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos Obligatorios Incompletos',
                    html: `Debe completar los campos obligatorios marcados en rojo antes de guardar:<br><br><div style="text-align:left; background:#fef2f2; border:1px solid #fca5a5; padding:10px 14px; border-radius:6px; color:#991b1b; font-size:0.85rem;"><ul style="margin:0; padding-left:20px;">${missingFields.map(f => `<li><b>${f}</b></li>`).join('')}</ul></div>`,
                    confirmButtonColor: '#dc2626',
                    confirmButtonText: 'Entendido'
                }).then(() => {
                    if (firstInvalidEl) {
                        if (firstInvalidEl.id === 'nomCliente') {
                            const rucEl = document.getElementById('rucCliente');
                            if (rucEl) rucEl.focus();
                        } else {
                            firstInvalidEl.focus();
                        }
                    }
                });
                return false;
            }

            // ─── Validación: La fecha del comprobante no puede ser mayor a la fecha de vencimiento ───
            const fecIngresoVal = (document.getElementById('fecIngreso')?.value || '').trim();
            const vencTimbradoVal = (document.getElementById('vencTimbrado')?.value || '').trim();

            if (fecIngresoVal && vencTimbradoVal && fecIngresoVal > vencTimbradoVal) {
                const elFec = document.getElementById('fecIngreso');
                const elVenc = document.getElementById('vencTimbrado');
                if (elFec) {
                    elFec.style.border = '2px solid #dc2626';
                    elFec.style.backgroundColor = '#fef2f2';
                }
                if (elVenc) {
                    elVenc.style.border = '2px solid #dc2626';
                    elVenc.style.backgroundColor = '#fef2f2';
                }

                const fmtFec = formatFechaTabla(fecIngresoVal);
                const fmtVenc = formatFechaTabla(vencTimbradoVal);

                Swal.fire({
                    icon: 'error',
                    title: 'Fecha del Comprobante Inválida',
                    html: `La <b>fecha del comprobante</b> (<b>${fmtFec}</b>) no puede ser mayor a la <b>fecha de vencimiento del timbrado</b> (<b>${fmtVenc}</b>).<br><br><span style="color: #b91c1c; font-weight: 600;">El comprobante no puede haberse emitido con un timbrado ya vencido.</span>`,
                    confirmButtonColor: '#dc2626',
                    confirmButtonText: 'Corregir Fechas'
                }).then(() => {
                    if (elFec) elFec.focus();
                });
                return false;
            }

            return true;
        }

        function validarFacturaDuplicada(showAlert = true) {
            const tipDocVal = (document.getElementById('tipDoc')?.value || '').trim().toUpperCase();
            const isFacturaDoc = (tipDocVal === 'FACTURA' || tipDocVal === 'FAC' || tipDocVal.startsWith('FAC')) && !tipDocVal.includes('AUTO');
            if (!isFacturaDoc) return false;

            const est = (document.getElementById('facEst')?.value || '1').trim().padStart(3, '0');
            const pto = (document.getElementById('facPto')?.value || '1').trim().padStart(3, '0');
            const nro = (document.getElementById('facNro')?.value || '').trim();
            if (!nro) return false;

            const formattedNro = nro.padStart(7, '0');
            const nroFactura = `${est}-${pto}-${formattedNro}`;
            const facClean = nroFactura.replace(/[-\s]/g, '');
            const timbClean = (document.getElementById('nroTimbrado')?.value || '').trim();
            const curId = document.getElementById('idIngreso')?.value;

            if (!timbClean || !facClean || !listIngresosData || listIngresosData.length === 0) return false;

            const dupFound = listIngresosData.find(item => {
                if (curId && String(item.ID_INGRESO || item.id_ingreso) === String(curId)) return false;
                const itemTip = String(item.TIP_DOC || item.tip_doc || '').trim().toUpperCase();
                const isItemFactura = (itemTip === 'FACTURA' || itemTip === 'FAC' || itemTip.startsWith('FAC')) && !itemTip.includes('AUTO');
                if (!isItemFactura) return false;

                const itemTimb = String(item.NRO_TIMBRADO || item.nro_timbrado || '').trim();
                const itemFac = String(item.NRO_FACTURA || item.nro_factura || '').replace(/[-\s]/g, '');

                return itemTimb === timbClean && itemFac === facClean;
            });

            if (dupFound) {
                const elFac = document.getElementById('facNro');
                if (elFac) {
                    elFac.style.border = '2px solid #dc2626';
                    elFac.style.backgroundColor = '#fef2f2';
                }
                if (showAlert) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Factura Duplicada',
                        html: `Ya se encuentra registrada una <b>Factura</b> con N° <b>${nroFactura}</b> y Timbrado <b>${timbClean}</b>.<br><br><span style="color:#b91c1c; font-weight:600;">No se permite guardar ni editar facturas con el mismo número de comprobante y timbrado.</span>`,
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'Corregir Número'
                    }).then(() => {
                        if (elFac) elFac.focus();
                    });
                }
                return true;
            } else {
                const elFac = document.getElementById('facNro');
                if (elFac && elFac.style.borderColor === 'rgb(220, 38, 38)') {
                    elFac.style.border = '1.5px solid #cbd5e1';
                    elFac.style.backgroundColor = '#ffffff';
                }
                return false;
            }
        }

        function resetFormBorders() {
            ['tipDoc', 'regimen', 'nroTimbrado', 'vencTimbrado', 'facEst', 'facPto', 'facNro', 'rucCliente', 'nomCliente', 'fecIngreso'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.style.border = '1.5px solid #cbd5e1';
                    if (id === 'nomCliente' || id === 'facEst' || id === 'facPto' || id === 'vencTimbrado') {
                        el.style.backgroundColor = '#f8fafc';
                    } else {
                        el.style.backgroundColor = '#ffffff';
                    }
                }
            });
        }

        function limpiarPantallaParaNuevoIngreso() {
            resetFormBorders();
            selectedIdIngreso = null;
            document.querySelectorAll('#tablaIngresosBody tr').forEach(tr => tr.classList.remove('fila-seleccionada'));

            document.getElementById('idIngreso').value = '';
            document.getElementById('modalTitle').innerText = 'Registrar ingreso';

            // Limpiar comprobante y cliente
            document.getElementById('cdc').value = '';
            document.getElementById('chkAnulada').checked = false;
            document.getElementById('chkInutilizado').checked = false;
            document.getElementById('facNro').value = '';
            document.getElementById('serie').value = '';
            document.getElementById('fecIngreso').valueAsDate = new Date();
            document.getElementById('rucCliente').value = '';
            document.getElementById('nomCliente').value = '';
            document.getElementById('codCliente').value = '';

            // Limpiar montos e impuestos
            document.getElementById('grav10').value = 0;
            document.getElementById('grav5').value = 0;
            document.getElementById('exentas').value = 0;
            document.getElementById('noGravado').value = 0;
            document.getElementById('redondeo').value = 0;
            document.getElementById('iva10').value = 0;
            document.getElementById('iva5').value = 0;
            document.getElementById('totIva').value = 0;
            document.getElementById('valorBruto').value = 0;
            document.getElementById('valorTotal').value = 0;
            document.getElementById('observacion').value = '';
            document.getElementById('codMoneda').value = '1';
            document.getElementById('tasaCambio').value = 1;

            document.querySelectorAll('input[name="condicion"]').forEach(r => {
                r.checked = (r.value === 'CON');
            });

            const selectMon = document.getElementById('codMoneda');
            if (selectMon) selectMon.value = '1';

            const selectReg = document.getElementById('regimen');
            if (selectReg && selectReg.options.length > 0) selectReg.value = '1';

            const selectTip = document.getElementById('tipIngreso');
            if (selectTip && selectTip.options.length > 0) selectTip.value = '1';

            actualizarTimbradosPorTipoDoc();
            recalcularTotales();

            // Foco directo en el campo RUC para seguir registrando de inmediato
            setTimeout(() => {
                const rucEl = document.getElementById('rucCliente');
                if (rucEl) rucEl.focus();
            }, 100);
        }

        function guardarIngreso(emitirSifen = false) {
            resetFormBorders();
            if (!validarCamposObligatoriosIngreso()) {
                return;
            }

            // ─── Validación estricta: No permitir duplicados de comprobante y timbrado para Factura ───
            if (validarFacturaDuplicada(true)) {
                return;
            }

            const cdc = document.getElementById('cdc').value;
            const rucCliente = document.getElementById('rucCliente').value;
            const nomCliente = document.getElementById('nomCliente').value;
            const codCliente = document.getElementById('codCliente').value;
            const regimenVal = document.getElementById('regimen').value;
            const tipIngresoVal = document.getElementById('tipIngreso').value;

            const est = (document.getElementById('facEst').value || '1').trim().padStart(3, '0');
            const pto = (document.getElementById('facPto').value || '1').trim().padStart(3, '0');
            const nro = (document.getElementById('facNro').value || '').trim();
            const formattedNro = nro ? nro.padStart(7, '0') : '';
            const nroFactura = nro ? `${est}-${pto}-${formattedNro}` : '';

            const payload = {
                idIngreso: document.getElementById('idIngreso').value,
                cdc: cdc,
                emitirSifen: emitirSifen,
                tipDoc: document.getElementById('tipDoc').value,
                regimen: regimenVal,
                codRegimen: regimenVal,
                anulada: document.getElementById('chkAnulada').checked,
                inutilizado: document.getElementById('chkInutilizado').checked,
                nroTimbrado: document.getElementById('nroTimbrado').value,
                vencTimbrado: document.getElementById('vencTimbrado').value,
                nroFactura: nroFactura,
                serie: document.getElementById('serie').value,
                fecIngreso: document.getElementById('fecIngreso').value,
                condicion: document.querySelector('input[name="condicion"]:checked')?.value || 'CON',
                codCliente: codCliente,
                rucCliente: rucCliente,
                nomCliente: nomCliente,
                tipIngreso: tipIngresoVal,
                codTipoIngreso: tipIngresoVal,
                form145: document.getElementById('form145').value,
                codMoneda: document.getElementById('codMoneda').value || '1',
                tasaCambio: document.getElementById('tasaCambio').value,
                grav10: parseMonto(document.getElementById('grav10').value),
                iva10: document.getElementById('iva10').value.replace(/\./g, ''),
                grav5: parseMonto(document.getElementById('grav5').value),
                iva5: document.getElementById('iva5').value.replace(/\./g, ''),
                exentas: parseMonto(document.getElementById('exentas').value),
                totIva: document.getElementById('totIva').value.replace(/\./g, ''),
                valorBruto: document.getElementById('valorBruto').value.replace(/\./g, ''),
                noGravado: parseMonto(document.getElementById('noGravado').value),
                redondeo: parseMonto(document.getElementById('redondeo').value),
                valorTotal: document.getElementById('valorTotal').value.replace(/\./g, ''),
                observacion: document.getElementById('observacion').value
            };

            fetch('/api/ingresos/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    // 1. Actualizar el listado abajo inmediatamente
                    cargarIngresos();

                    // 2. Limpiar la pantalla de carga para seguir registrando comprobantes
                    limpiarPantallaParaNuevoIngreso();

                    // 3. Si se emitió un Documento Electrónico SIFEN, ofrecer ver el KuDE con QR
                    if (data.sifen && data.sifen.cdc) {
                        Swal.fire({
                            icon: 'success',
                            title: '¡Documento Electrónico Emitido!',
                            html: `<b>CDC (44 dígitos):</b><br><code style="font-size:0.85rem;color:#15803d;font-weight:700;">${data.sifen.cdcFormateado || data.sifen.cdc}</code><br><br><b>Estado SIFEN:</b> ${data.sifen.estadoSifen || 'EMITIDO'}<br><span style="font-size:0.82rem;color:#475569;">${data.sifen.mensajeRespuesta || ''}</span>`,
                            showCancelButton: true,
                            confirmButtonColor: '#16a34a',
                            cancelButtonColor: '#64748b',
                            confirmButtonText: '🖨️ Imprimir KuDE / QR',
                            cancelButtonText: 'Continuar cargando'
                        }).then(r => {
                            if (r.isConfirmed && data.idIngreso) {
                                window.open('/app/kude/print?id=' + encodeURIComponent(data.idIngreso), '_blank');
                            }
                        });
                    } else {
                        Swal.fire({
                            toast: true,
                            position: 'top-end',
                            icon: 'success',
                            title: '¡Ingreso guardado con éxito!',
                            text: 'Listado actualizado. Pantalla lista para el siguiente comprobante.',
                            showConfirmButton: false,
                            timer: 2500,
                            timerProgressBar: true
                        });
                    }
                } else {
                    Swal.fire('Error', data.message, 'error');
                }
            })
            .catch(err => {
                Swal.fire('Error', 'Fallo de conexión al guardar el ingreso.', 'error');
            });
        }

        function emitirSifenSeleccionado() {
            if (!selectedIdIngreso) {
                Swal.fire('Atención', 'Seleccione un comprobante de ingreso de la tabla para emitir su Documento Electrónico SIFEN.', 'warning');
                return;
            }
            Swal.fire({
                title: 'Procesando en SIFEN...',
                text: 'Calculando CDC de 44 dígitos, firmando XML v150 y generando código QR oficial...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            fetch('/api/sifen/emitir', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idIngreso: selectedIdIngreso })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.cdc) {
                    cargarIngresos();
                    Swal.fire({
                        icon: 'success',
                        title: '¡Factura Electrónica Generada!',
                        html: `<b>CDC (44 dígitos):</b><br><code style="font-size:0.85rem;color:#15803d;font-weight:700;">${data.cdcFormateado || data.cdc}</code><br><br><b>Estado SIFEN:</b> ${data.estadoSifen || 'EMITIDO'}<br><span style="font-size:0.82rem;color:#475569;">${data.mensajeRespuesta || ''}</span>`,
                        showCancelButton: true,
                        confirmButtonColor: '#16a34a',
                        cancelButtonColor: '#64748b',
                        confirmButtonText: '🖨️ Ver e Imprimir KuDE / QR',
                        cancelButtonText: 'Cerrar'
                    }).then(r => {
                        if (r.isConfirmed) {
                            window.open('/app/kude/print?id=' + encodeURIComponent(selectedIdIngreso), '_blank');
                        }
                    });
                } else {
                    Swal.fire('Error SIFEN', data.mensajeRespuesta || data.message || 'No se pudo emitir el Documento Electrónico.', 'error');
                }
            })
            .catch(() => Swal.fire('Error', 'Error de comunicación con el servicio SIFEN.', 'error'));
        }

        function imprimirKudeSeleccionado() {
            if (!selectedIdIngreso) {
                Swal.fire('Atención', 'Seleccione un comprobante de ingreso de la tabla para ver e imprimir su KuDE.', 'warning');
                return;
            }
            window.open('/app/kude/print?id=' + encodeURIComponent(selectedIdIngreso), '_blank');
        }

        function cancelarSifenSeleccionado() {
            if (!selectedIdIngreso) {
                Swal.fire('Atención', 'Seleccione un comprobante de ingreso de la tabla para cancelar en SIFEN.', 'warning');
                return;
            }
            Swal.fire({
                title: 'Cancelar Documento Electrónico en SIFEN',
                input: 'text',
                inputLabel: 'Motivo de la cancelación (requerido por la DNIT):',
                inputValue: 'Cancelación de comprobante electrónico por error en emisión',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Enviar Evento de Cancelación',
                cancelButtonText: 'Volver'
            }).then(result => {
                if (result.isConfirmed && result.value) {
                    fetch('/api/sifen/cancelar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ idIngreso: selectedIdIngreso, motivo: result.value })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            cargarIngresos();
                            Swal.fire('Cancelado en SIFEN', data.mensajeRespuesta || 'Evento de cancelación registrado correctamente.', 'success');
                        } else {
                            Swal.fire('Atención', data.message || data.mensajeRespuesta || 'No se pudo cancelar el documento.', 'warning');
                        }
                    });
                }
            });
        }

        function eliminarIngreso() {
            if (!selectedIdIngreso) {
                Swal.fire('Atención', 'Seleccione un ingreso de la tabla para eliminar.', 'warning');
                return;
            }

            Swal.fire({
                title: '¿Eliminar Ingreso?',
                text: 'Esta acción no se puede deshacer.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(result => {
                if (result.isConfirmed) {
                    fetch('/api/ingresos/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ idIngreso: selectedIdIngreso })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            Swal.fire('Eliminado', data.message, 'success');
                            selectedIdIngreso = null;
                            cargarIngresos();
                        } else {
                            Swal.fire('Error', data.message, 'error');
                        }
                    });
                }
            });
        }

        function importarMarangatu() {
            Swal.fire('Importación Marangatu', 'Función de sincronización con archivos CSV/Excel de la SET.', 'info');
        }

        function importarComprobante() {
            Swal.fire('Importación de Comprobantes', 'Seleccione un archivo de comprobante para importar.', 'info');
        }
    </script>
