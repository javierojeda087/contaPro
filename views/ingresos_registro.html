<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar Ingreso - Sistema Contable')}">
</head>
<body style="background: var(--bg-color);">

    <!-- Left Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Navbar -->
        <div th:replace="~{fragments/layout :: navbar('Registro de Ingresos de Venta')}"></div>

        <div class="content-area">
            
            <!-- MAIN TABLE CARD WINDOW MATCHING REFERENCE DESIGN -->
            <div style="background: white; border-radius: 14px; border: 1px solid #cbd5e1; box-shadow: 0 8px 25px rgba(0,0,0,0.06); overflow: hidden; width: 100%; min-height: calc(100vh - 140px); display: flex; flex-direction: column;">
                

                <!-- Toolbar & Search Header -->
                <div style="padding: 14px 22px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; flex-shrink: 0;">
                    
                    <!-- Action Toolbar Buttons -->
                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                        <button type="button" class="btn" onclick="abrirModalNuevo()" style="background: white; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.88rem; color: #1e293b; height: 38px; padding: 0 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: all 0.2s;" onmouseover="this.style.borderColor='#16a34a'; this.style.color='#16a34a'" onmouseout="this.style.borderColor='#cbd5e1'; this.style.color='#1e293b'">
                            <i class="ph ph-plus-circle" style="color: #16a34a; font-size: 1.15rem;"></i> Nuevo
                        </button>
                        <button type="button" class="btn" onclick="abrirModalEditar()" style="background: white; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.88rem; color: #1e293b; height: 38px; padding: 0 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: all 0.2s;" onmouseover="this.style.borderColor='#15803d'; this.style.color='#15803d'" onmouseout="this.style.borderColor='#cbd5e1'; this.style.color='#1e293b'">
                            <i class="ph ph-pencil-simple" style="color: #15803d; font-size: 1.15rem;"></i> Modificar
                        </button>
                        <button type="button" class="btn" onclick="eliminarIngreso()" style="background: white; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.88rem; color: #ef4444; height: 38px; padding: 0 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: all 0.2s;" onmouseover="this.style.background='#fef2f2'; this.style.borderColor='#fca5a5'" onmouseout="this.style.background='white'; this.style.borderColor='#cbd5e1'">
                            <i class="ph ph-trash" style="font-size: 1.15rem;"></i> Eliminar
                        </button>

                        <div style="height: 24px; width: 1px; background: #cbd5e1; margin: 0 4px;"></div>

                        <button type="button" class="btn" onclick="emitirSifenSeleccionado()" title="Generar CDC 44 dígitos, XML v150 y QR en SIFEN" style="background: #f0fdf4; border: 1.5px solid #86efac; font-weight: 800; font-size: 0.85rem; color: #15803d; height: 38px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-seal-check" style="font-size: 1.15rem; color: #16a34a;"></i> Emitir SIFEN
                        </button>
                        <button type="button" class="btn" onclick="imprimirKudeSeleccionado()" title="Ver e Imprimir KuDE (Representación Gráfica Oficial con QR)" style="background: white; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #0f172a; height: 38px; padding: 0 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-printer" style="font-size: 1.15rem; color: #0284c7;"></i> KuDE / QR
                        </button>
                        <button type="button" class="btn" onclick="cancelarSifenSeleccionado()" title="Enviar Evento de Cancelación a SIFEN" style="background: white; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.85rem; color: #b91c1c; height: 38px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; gap: 5px;">
                            <i class="ph ph-prohibit" style="font-size: 1.1rem; color: #dc2626;"></i> Cancelar DE
                        </button>

                        <div style="height: 24px; width: 1px; background: #cbd5e1; margin: 0 4px;"></div>

                        <button type="button" class="btn" onclick="importarMarangatu()" style="background: white; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.88rem; color: #475569; height: 38px; padding: 0 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-download-simple" style="font-size: 1.15rem; color: #16a34a;"></i> Importar Marangatu
                        </button>
                        <button type="button" class="btn" onclick="importarComprobante()" style="background: white; border: 1.5px solid #cbd5e1; font-weight: 700; font-size: 0.88rem; color: #475569; height: 38px; padding: 0 16px; border-radius: 8px; display: flex; align-items: center; gap: 6px;">
                            <i class="ph ph-upload-simple" style="font-size: 1.15rem; color: #16a34a;"></i> Importar
                        </button>
                    </div>

                    <!-- Periodo & Search Controls matching Image 2 -->
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <div style="display: flex; align-items: center; gap: 8px; background: #ffffff; height: 38px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-size: 0.88rem;">
                            <span style="font-weight: 700; color: #64748b;">Periodo:</span>
                            <!-- Año Select -->
                            <select id="filtroAnio" onchange="cargarIngresos()" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 8px; font-weight: 700; color: #0f172a; font-size: 0.85rem; outline: none; background: #f8fafc; cursor: pointer; height: 28px;">
                                <option value="TODOS">Todos</option>
                            </select>
                            <!-- Mes Select -->
                            <select id="filtroMes" onchange="cargarIngresos()" style="border: 2px solid #16a34a; border-radius: 6px; padding: 3px 8px; font-weight: 800; color: #15803d; font-size: 0.85rem; outline: none; background: #dcfce7; cursor: pointer; height: 28px;" title="Seleccionar Mes">
                                <option value="TODOS">Todos</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                            </select>
                        </div>

                        <!-- Filtro Régimen -->
                        <div style="display: flex; align-items: center; gap: 8px; background: #ffffff; height: 38px; padding: 0 12px; border-radius: 8px; border: 1.5px solid #cbd5e1; font-size: 0.88rem;">
                            <span style="font-weight: 700; color: #64748b;">Régimen:</span>
                            <select id="filtroRegimen" onchange="filtrarIngresos()" style="border: 1px solid #cbd5e1; border-radius: 6px; padding: 3px 8px; font-weight: 700; color: #0f172a; font-size: 0.85rem; outline: none; background: #f8fafc; cursor: pointer; height: 28px;">
                                <option value="TODOS">Todos</option>
                                <option value="1">IRP & IVA</option>
                                <option value="2">IRP</option>
                                <option value="3">IVA</option>
                                <option value="4">G. CAPITAL</option>
                            </select>
                        </div>

                        <!-- Search Input with CTRL+F placeholder -->
                        <div style="position: relative; width: 230px;">
                            <input type="text" id="searchInput" class="form-control" placeholder="BUSCAR" onkeyup="filtrarIngresos()" style="padding-right: 36px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; border-radius: 8px; border: 1.5px solid #cbd5e1; background: #ffffff; height: 38px;" autocomplete="off">
                            <i class="ph ph-magnifying-glass" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 1.1rem;"></i>
                        </div>
                    </div>
                </div>

                <!-- Ingresos Table matching Image 2 columns -->
                <div style="overflow-x: auto; flex: 1; min-height: 520px;">
                    <table class="table table-hover align-middle m-0" style="font-size: 0.9rem;">
                        <thead style="background: #f8fafc; color: #334155; font-weight: 800; font-size: 0.85rem; border-bottom: 2px solid #e2e8f0;">
                            <tr>
                                <th onclick="ordenarTabla('nroFactura')" style="padding: 14px 16px; cursor: pointer; user-select: none;">
                                    Factura <span class="sort-icon" id="sort_nroFactura" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('nroTimbrado')" style="padding: 14px 16px; cursor: pointer; user-select: none;">
                                    Timbrado <span class="sort-icon" id="sort_nroTimbrado" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('tipDoc')" style="padding: 14px 16px; cursor: pointer; user-select: none;">
                                    Tipo <span class="sort-icon" id="sort_tipDoc" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('fecIngreso')" style="padding: 14px 16px; text-align: center; cursor: pointer; user-select: none;">
                                    Fecha <span class="sort-icon" id="sort_fecIngreso" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('rucCliente')" style="padding: 14px 16px; cursor: pointer; user-select: none;">
                                    Ruc <span class="sort-icon" id="sort_rucCliente" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('nomCliente')" style="padding: 14px 16px; cursor: pointer; user-select: none;">
                                    Cliente <span class="sort-icon" id="sort_nomCliente" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('condicion')" style="padding: 14px 16px; text-align: center; cursor: pointer; user-select: none;">
                                    C.V. <span class="sort-icon" id="sort_condicion" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('codMoneda')" style="padding: 14px 16px; text-align: center; cursor: pointer; user-select: none;">
                                    Mon. <span class="sort-icon" id="sort_codMoneda" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('exentas')" style="padding: 14px 16px; text-align: right; cursor: pointer; user-select: none;">
                                    Exenta <span class="sort-icon" id="sort_exentas" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('iva5')" style="padding: 14px 16px; text-align: right; cursor: pointer; user-select: none;">
                                    IVA 5% <span class="sort-icon" id="sort_iva5" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('iva10')" style="padding: 14px 16px; text-align: right; cursor: pointer; user-select: none;">
                                    IVA 10% <span class="sort-icon" id="sort_iva10" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                                <th onclick="ordenarTabla('valorTotal')" style="padding: 14px 16px; text-align: right; cursor: pointer; user-select: none;">
                                    Total <span class="sort-icon" id="sort_valorTotal" style="font-size: 0.8rem; color: #94a3b8;">↕</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="tablaIngresosBody">
                            <tr>
                                <td colspan="12" class="text-center py-5 text-muted">
                                    <i class="ph ph-spinner-gap" style="font-size: 2rem; animation: spin 1s linear infinite;" display="block"></i>
                                    <div class="mt-2" style="font-size: 0.95rem; font-weight: 600;">Cargando ingresos registrados...</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>

        </div>
    </main>

    <!-- PERFECT CENTERED FORM MODAL OVERLAY (SIN DIFUMINADO DE FONDO, MAS ANCHO Y ALTO, LISTADO VISIBLE ABAJO) -->
    <div id="ingresoModalOverlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.45); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; transition: opacity 0.2s ease;">
        
        <div style="background: white; border-radius: 14px; border: 1px solid #94a3b8; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); width: 96vw; max-width: 1280px; max-height: 94vh; display: flex; flex-direction: column; overflow: hidden; animation: modalSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1);">
            
            <!-- Window Header -->
            <div style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, #16a34a, #15803d); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.25rem;">
                        <i class="ph ph-receipt"></i>
                    </div>
                    <h3 id="modalTitle" style="margin: 0; font-size: 1.15rem; font-weight: 800; color: #0f172a;">Registrar ingreso</h3>
                </div>
                <button type="button" class="btn-close" onclick="cerrarModal()" style="font-size: 0.95rem; cursor: pointer;"></button>
            </div>

            <!-- Tab Header -->
            <div style="background: #f1f5f9; border-bottom: 1px solid #cbd5e1; padding: 0 24px; display: flex; gap: 6px; flex-shrink: 0;">
                <div style="padding: 10px 22px; background: white; border-top-left-radius: 8px; border-top-right-radius: 8px; font-weight: 700; color: #15803d; border: 1px solid #cbd5e1; border-bottom: none; margin-bottom: -1px; font-size: 0.92rem;">
                    Encabezado
                </div>
            </div>

            <!-- Form Fields Body -->
            <div style="padding: 20px 26px; overflow-y: auto; flex: 1; max-height: calc(94vh - 125px);">
                <form id="formIngreso">
                    <input type="hidden" id="idIngreso">
                    <input type="hidden" id="codCliente">

                    <!-- CDC Row -->
                    <div style="display: grid; grid-template-columns: 125px 1fr 100px 85px; gap: 10px; align-items: center; margin-bottom: 12px;">
                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">CDC :</label>
                        <div style="position: relative; display: flex; align-items: center;">
                            <input type="text" id="cdc" maxlength="44" placeholder="____________________________________________" style="width: 100%; letter-spacing: 2px; font-family: monospace; font-weight: 700; font-size: 0.92rem; height: 38px; padding: 4px 34px 4px 10px; border-radius: 8px; border: 1.5px solid #cbd5e1; background: #fafafa;" oninput="formatCDC(this)">
                            <i class="ph ph-info" style="position: absolute; right: 10px; color: #16a34a; font-size: 1.25rem; cursor: pointer;" title="Código de Control Documental (44 dígitos SIFEN)"></i>
                        </div>
                        <button type="button" class="btn" onclick="verificarCDC()" style="border: 1.5px solid #cbd5e1; background: white; font-weight: 700; font-size: 0.85rem; color: #334155; height: 38px; padding: 0 10px; border-radius: 8px;">Verificar</button>
                        <button type="button" class="btn" onclick="abrirQRModal()" style="border: 1.5px solid #cbd5e1; background: white; font-weight: 700; font-size: 0.85rem; color: #334155; height: 38px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 5px;">
                            <i class="ph ph-qr-code" style="font-size: 1.15rem;"></i> QR
                        </button>
                    </div>

                    <!-- Tipo Doc / Regimen / Checkboxes Row -->
                    <div style="display: grid; grid-template-columns: 125px 1fr 125px 1fr auto; gap: 10px 18px; align-items: center; margin-bottom: 12px;">
                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">Tipo de Doc. :</label>
                        <select id="tipDoc" class="form-control" style="border-radius: 8px; font-size: 0.92rem; height: 38px; padding: 4px 10px; border: 1.5px solid #cbd5e1;" onchange="actualizarTimbradosPorTipoDoc()">
                            <option value="Factura" selected>Factura</option>
                            <option value="Nota de Débito">Nota de Débito</option>
                            <option value="Nota de Crédito">Nota de Crédito</option>
                            <option value="Autofactura">Autofactura</option>
                        </select>

                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">Régimen :</label>
                        <select id="regimen" class="form-control" style="border-radius: 8px; font-size: 0.92rem; height: 38px; padding: 4px 10px; font-weight: 600; border: 1.5px solid #cbd5e1;">
                            <option value="1" selected>IRP & IVA</option>
                            <option value="2">IRP</option>
                            <option value="3">IVA</option>
                            <option value="4">G. CAPITAL</option>
                        </select>

                        <div style="display: flex; gap: 16px; align-items: center; padding-left: 6px;">
                            <label style="font-size: 0.88rem; font-weight: 700; color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0;">
                                Anulada : <input type="checkbox" id="chkAnulada" style="width: 16px; height: 16px; accent-color: #ef4444;">
                            </label>
                            <label style="font-size: 0.88rem; font-weight: 700; color: #64748b; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0;">
                                Inutilizado : <input type="checkbox" id="chkInutilizado" style="width: 16px; height: 16px; accent-color: #f59e0b;">
                            </label>
                        </div>
                    </div>

                    <!-- Timbrado / Vencimiento / Condición Row -->
                    <div style="display: grid; grid-template-columns: 125px 1fr 125px 1fr auto; gap: 10px 18px; align-items: center; margin-bottom: 12px;">
                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">Timbrado :</label>
                        <select id="nroTimbrado" class="form-control" style="border-radius: 8px; font-size: 0.92rem; height: 38px; padding: 4px 10px; font-weight: 700; border: 1.5px solid #16a34a; color: #15803d;" onchange="alSeleccionarTimbrado()"></select>

                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">Venc. timbrado :</label>
                        <input type="date" id="vencTimbrado" class="form-control" onchange="validarFechasComprobanteVencimiento()" style="border-radius: 8px; font-size: 0.92rem; height: 38px; padding: 4px 10px; background: #f8fafc; border: 1.5px solid #cbd5e1;" readonly>

                        <div style="display: flex; gap: 18px; align-items: center; padding-left: 6px; min-width: 195px;">
                            <label style="font-size: 0.88rem; font-weight: 700; color: #1e293b; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0;">
                                <input type="radio" name="condicion" value="CON" checked style="accent-color: #16a34a; width: 16px; height: 16px;"> Contado
                            </label>
                            <label style="font-size: 0.88rem; font-weight: 700; color: #1e293b; cursor: pointer; display: flex; align-items: center; gap: 6px; margin: 0;">
                                <input type="radio" name="condicion" value="CRE" style="accent-color: #16a34a; width: 16px; height: 16px;"> Crédito
                            </label>
                        </div>
                    </div>

                    <!-- Factura Nro / Fecha / Serie Row -->
                    <div style="display: grid; grid-template-columns: 125px 1fr 125px 1fr auto; gap: 10px 18px; align-items: center; margin-bottom: 12px;">
                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">Factura :</label>
                        <div style="display: flex; gap: 6px; align-items: center;">
                            <input type="text" id="facEst" maxlength="3" value="001" readonly tabindex="-1" style="width: 52px; text-align: center; border-radius: 8px; border: 1.5px solid #cbd5e1; height: 38px; font-size: 0.92rem; padding: 0; background: #f8fafc; font-weight: 700; color: #334155;">
                            <span style="font-weight: 700; color: #64748b;">-</span>
                            <input type="text" id="facPto" maxlength="3" value="001" readonly tabindex="-1" style="width: 52px; text-align: center; border-radius: 8px; border: 1.5px solid #cbd5e1; height: 38px; font-size: 0.92rem; padding: 0; background: #f8fafc; font-weight: 700; color: #334155;">
                            <span style="font-weight: 700; color: #64748b;">-</span>
                            <input type="text" id="facNro" maxlength="7" placeholder="0000001" onblur="validarFacturaDuplicada(false)" onchange="validarFacturaDuplicada(true)" style="flex: 1; min-width: 90px; text-align: right; border-radius: 8px; border: 1.5px solid #cbd5e1; height: 38px; font-size: 0.95rem; font-weight: 700; padding: 4px 10px;">
                        </div>

                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">Fecha :</label>
                        <input type="date" id="fecIngreso" class="form-control" onchange="validarFechasComprobanteVencimiento()" style="border-radius: 8px; font-size: 0.92rem; height: 38px; padding: 4px 10px; border: 1.5px solid #cbd5e1;">

                        <div style="display: flex; gap: 8px; align-items: center; padding-left: 6px; min-width: 195px;">
                            <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155; white-space: nowrap;">Serie :</label>
                            <input type="text" id="serie" maxlength="5" placeholder="A" style="width: 90px; border-radius: 8px; font-size: 0.92rem; height: 38px; padding: 4px 10px; text-transform: uppercase; text-align: center; font-weight: 700; border: 1.5px solid #cbd5e1;">
                        </div>
                    </div>

                    <!-- Cliente Row -->
                    <div style="display: grid; grid-template-columns: 125px 180px 1fr 95px; gap: 10px; align-items: center; margin-bottom: 12px;">
                        <label style="text-align: right; font-weight: 700; font-size: 0.88rem; color: #334155;">Cliente :</label>
                        <input type="text" id="rucCliente" class="form-control" placeholder="RUC / Cód" onchange="verificarYCrearClienteIngreso()" onkeypress="if(event.key === 'Enter'){verificarYCrearClienteIngreso(); event.preventDefault();}" style="border-radius: 8px; font-size: 0.92rem; height: 38px; padding: 4px 10px; font-weight: 700; border: 1.5px solid #cbd5e1;">

    <!-- Layout Scripts -->

    <script>
        let listIngresosData = [];
        let listTimbradosCache = [];
        let selectedIdIngreso = null;
        let currentSortColumn = null;
        let currentSortAsc = true;

        document.addEventListener('DOMContentLoaded', function() {
            inicializarFiltroPeriodo();
            cargarIngresos();
            cargarTiposComprobantes('INGRESOS');
            cargarTimbradosDefinidos();
            cargarRegimenesDynamic();
            cargarTiposIngresosDynamic();
            cargarMonedasDynamic();

            // Atajo de teclado CTRL+F para buscar (según diseño imagen 2)
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.key === 'f' || e.key === 'F')) {
                    e.preventDefault();
                    const sInput = document.getElementById('searchInput');
                    if (sInput) {
                        sInput.focus();
                        sInput.select();
                    }
                }
            });
        });

        function inicializarFiltroPeriodo() {
            const selectAnio = document.getElementById('filtroAnio');
            if (!selectAnio) return;

            const anioActual = new Date().getFullYear();
            let html = '<option value="TODOS">Todos</option>';
            for (let y = anioActual + 1; y >= anioActual - 5; y--) {
                html += `<option value="${y}">${y}</option>`;
            }
            selectAnio.innerHTML = html;

            // Seleccionar año actual o de la sesión si existe
            const ejSession = /*[[${session.ejercicio}]]*/ '';
            if (ejSession && ejSession !== '' && selectAnio.querySelector(`option[value="${ejSession}"]`)) {
                selectAnio.value = ejSession;
            } else {
                selectAnio.value = String(anioActual);
            }
        }

        async function cargarMonedasDynamic() {
            try {
                const res = await fetch('/api/monedas/all');
                const list = await res.json();
                const select = document.getElementById('codMoneda');
                if (select && list && list.length > 0) {
                    const currentVal = select.value;
                    select.innerHTML = '';
                    let defaultVal = '1';
                    list.forEach(m => {
                        const cod = String(m.COD_MONEDA || m.cod_moneda || m.codMoneda || '1');
                        const desc = m.DESCRIPCION || m.descripcion || m.SIGLAS || m.siglas || cod;
                        const opt = document.createElement('option');
                        opt.value = cod;
                        opt.text = desc;
                        select.appendChild(opt);

                        if (cod === '1' || desc.toUpperCase().includes('GUARAN')) {
                            defaultVal = cod;
                        }
                    });

                    if (currentVal && Array.from(select.options).some(o => o.value === currentVal)) {
                        select.value = currentVal;
                    } else {
                        select.value = defaultVal;
                    }
                }
            } catch (e) {
                console.warn('Error al cargar monedas:', e);
            }
        }

        async function cargarRegimenesDynamic() {
            try {
                const res = await fetch('/api/regimen/list');
                const list = await res.json();
                const select = document.getElementById('regimen');
                if (select && list && list.length > 0) {
                    const currentVal = String(select.value || '1');
                    select.innerHTML = '';
                    list.filter(item => (item.ESTADO || item.estado) === 'A' || String(item.COD_REGIMEN || item.cod_regimen) === currentVal).forEach(item => {
                        const cod = item.COD_REGIMEN || item.cod_regimen;
                        const desc = item.DESCRIPCION || item.descripcion;
                        const opt = document.createElement('option');
                        opt.value = cod;
                        opt.text = desc;
                        select.appendChild(opt);
                    });
                    if (currentVal && Array.from(select.options).some(o => String(o.value) === currentVal)) {
                        select.value = currentVal;
                    } else {
                        select.value = '1';
                    }
                }
            } catch (e) {
                console.warn('Error al cargar regímenes:', e);
            }
        }

        async function cargarTiposIngresosDynamic() {
            try {
                const res = await fetch('/api/tipo_ingreso/list');
                const data = await res.json();
                if (data && data.length > 0) {
                    const select = document.getElementById('tipIngreso');
                    const currentVal = String(select.value || '1');
                    select.innerHTML = '';
                    data.forEach(item => {
                        const id = item.COD_TIPO_INGRESO || item.cod_tipo_ingreso;
                        const desc = item.DESCRIPCION || item.descripcion;
                        const opt = document.createElement('option');
                        opt.value = id;
                        opt.text = desc;
                        select.appendChild(opt);
                    });
                    if (currentVal && Array.from(select.options).some(o => String(o.value) === currentVal)) {
                        select.value = currentVal;
                    } else if (select.options.length > 0) {
                        select.selectedIndex = 0;
                    }
                }
            } catch (e) {
                console.warn('Error al cargar tipos de ingresos:', e);
            }
        }

        function cargarIngresos() {
            const anioVal = document.getElementById('filtroAnio')?.value || 'TODOS';
            const mesVal = document.getElementById('filtroMes')?.value || 'TODOS';

            fetch(`/api/ingresos/list?anio=${encodeURIComponent(anioVal)}&mes=${encodeURIComponent(mesVal)}`)
                .then(res => res.json())
                .then(res => {
                    if (res.status === 'success') {
                        listIngresosData = res.data || [];
                        filtrarIngresos();
                    }
                })
                .catch(err => {
                    console.error('Error al cargar ingresos:', err);
                });
        }

        function formatFechaTabla(fec) {
            if (!fec) return '-';
            let str = String(fec).trim();
            if (str.includes('T')) str = str.split('T')[0];
            if (str.includes(' ')) str = str.split(' ')[0];
            if (str.matches && str.matches(/\d{2}\/\d{2}\/\d{4}/)) return str;
            if (str.includes('-')) {
                const parts = str.split('-');
                if (parts.length === 3) {
                    return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
                }
            }
            return str;
        }

        function formatNroFactura(nroFactura, tipDoc) {
            if (!nroFactura) return '-';
            let s = String(nroFactura).trim();
            if (!s || s === '-') return '-';

            if (s.includes('-')) {
                let parts = s.split('-');
                if (parts.length === 3) {
                    let est = parts[0].trim().padStart(3, '0');
                    let pto = parts[1].trim().padStart(3, '0');
                    let num = parts[2].trim().padStart(7, '0');
                    return `${est}-${pto}-${num}`;
                }
            } else if (/^\d+$/.test(s)) {
                if (s.length === 13) {
                    let est = s.substring(0, 3);
                    let pto = s.substring(3, 6);
                    let num = s.substring(6).padStart(7, '0');
                    return `${est}-${pto}-${num}`;
                } else {
                    return `001-001-${s.padStart(7, '0')}`;
                }
            }
            return s;
        }

        function renderTabla(data) {
            const tbody = document.getElementById('tablaIngresosBody');
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="text-center py-5 text-muted" style="font-weight:600;">No se encontraron registros de ingresos para el periodo seleccionado.</td></tr>';
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.dataset.id = item.ID_INGRESO || item.id_ingreso;
                tr.style.cursor = 'pointer';
                tr.style.transition = 'all 0.15s ease';

                const isSelected = (selectedIdIngreso && selectedIdIngreso == (item.ID_INGRESO || item.id_ingreso));
                if (isSelected) {
                    tr.classList.add('fila-seleccionada');
                }

                tr.onclick = function() {
                    document.querySelectorAll('#tablaIngresosBody tr').forEach(r => {
                        r.classList.remove('fila-seleccionada');
                    });
                    tr.classList.add('fila-seleccionada');
                    selectedIdIngreso = item.ID_INGRESO || item.id_ingreso;
                };

                tr.ondblclick = function() {
                    selectedIdIngreso = item.ID_INGRESO || item.id_ingreso;
                    abrirModalEditar();
                };

                const fecStr = formatFechaTabla(item.FEC_INGRESO_FMT || item.fec_ingreso_fmt || item.FEC_INGRESO || item.fec_ingreso);
                const rawFac = item.NRO_FACTURA || item.nro_factura || '-';
                const tipDocStr = item.TIP_DOC || item.tip_doc || 'Pre-impreso';
                const nroFac = formatNroFactura(rawFac, tipDocStr);
                const nroTimb = item.NRO_TIMBRADO || item.nro_timbrado || '-';
                const rucStr = item.RUC_CLIENTE || item.ruc_cliente || '-';
                const nomStr = item.NOM_CLIENTE || item.nom_cliente || '-';
                
                // Condición de Venta (C.V.): CRE para Crédito, CON para Contado
                const condStr = (item.CONDICION || item.condicion || 'CON').toUpperCase();
                const cvTag = (condStr === 'CRE' || condStr.includes('CRÉDITO') || condStr.includes('CREDITO')) ? 'CRE' : 'CON';
                
                // Moneda: GS. (1), US$ (2), R$ (3)
                const monRaw = String(item.COD_MONEDA || item.cod_moneda || '1').toUpperCase();
                const monTag = (monRaw === '2' || monRaw.includes('DOLAR') || monRaw.includes('USD') || monRaw.includes('US$')) ? 'US$' : (monRaw === '3' || monRaw.includes('REAL')) ? 'R$' : 'GS.';

                const valExenta = parseFloat(item.EXENTAS || item.exentas || 0);
                const valIva5 = parseFloat(item.IVA5 || item.iva5 || 0);
                const valIva10 = parseFloat(item.IVA10 || item.iva10 || 0);
                const valTot = parseFloat(item.VALOR_TOTAL || item.valor_total || 0);

                const formattedExenta = valExenta.toLocaleString('es-PY');
                const formattedIva5 = valIva5.toLocaleString('es-PY');
                const formattedIva10 = valIva10.toLocaleString('es-PY');
                const formattedTotal = valTot.toLocaleString('es-PY');

                const cdcRow = String(item.CDC || item.cdc || '').trim();
                const sifenEst = String(item.SIFEN_ESTADO || item.sifen_estado || '').toUpperCase();
                const isAnul = String(item.ANULADA || item.anulada || 'N') === 'S';
                let sifenBadge = '';
                if (isAnul || sifenEst === 'CANCELADO') {
                    sifenBadge = ' <span class="badge" style="background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;font-size:0.68rem;">ANULADO</span>';
                } else if (cdcRow.length === 44) {
                    sifenBadge = ` <span class="badge" title="CDC: ${cdcRow}" style="background:#f0fdf4;color:#15803d;border:1px solid #86efac;font-size:0.68rem;">SIFEN</span>`;
                }

                tr.innerHTML = `

        function ordenarTabla(columnKey) {
            if (currentSortColumn === columnKey) {
                currentSortAsc = !currentSortAsc;
            } else {
                currentSortColumn = columnKey;
                currentSortAsc = true;
            }

            // Actualizar iconos de ordenación en cabecera
            document.querySelectorAll('.sort-icon').forEach(icon => icon.innerText = '↕');
            const iconEl = document.getElementById('sort_' + columnKey);
            if (iconEl) {
                iconEl.innerText = currentSortAsc ? '▲' : '▼';
            }

            const dataToSort = [...listIngresosData];
            dataToSort.sort((a, b) => {
                let valA = a[columnKey] || a[columnKey.toUpperCase()] || a[columnKey.toLowerCase()] || '';
                let valB = b[columnKey] || b[columnKey.toUpperCase()] || b[columnKey.toLowerCase()] || '';

                if (columnKey === 'valorTotal') {
                    valA = parseFloat(valA) || 0;
                    valB = parseFloat(valB) || 0;
                } else {
                    valA = String(valA).toUpperCase();
                    valB = String(valB).toUpperCase();
                }

                if (valA < valB) return currentSortAsc ? -1 : 1;
                if (valA > valB) return currentSortAsc ? 1 : -1;
                return 0;
            });

            renderTabla(dataToSort);
        }

        function filtrarIngresos() {
            const query = (document.getElementById('searchInput')?.value || '').trim().toUpperCase();
            const regimenFiltro = (document.getElementById('filtroRegimen')?.value || 'TODOS').trim().toUpperCase();

            let filtered = listIngresosData;

            if (regimenFiltro && regimenFiltro !== 'TODOS') {
                filtered = filtered.filter(item => {
                    const r = String(item.COD_REGIMEN || item.cod_regimen || item.REGIMEN || item.regimen || '').toUpperCase();
                    if (r === regimenFiltro) return true;
                    if (regimenFiltro === '1' && r.includes('IRP') && r.includes('IVA')) return true;
                    if (regimenFiltro === '2' && r.includes('IRP') && !r.includes('IVA')) return true;
                    if (regimenFiltro === '3' && r.includes('IVA') && !r.includes('IRP')) return true;
                    if (regimenFiltro === '4' && r.includes('CAPITAL')) return true;
                    return false;
                });
            }

            if (query) {
                filtered = filtered.filter(item => {
                    const fac = String(item.NRO_FACTURA || item.nro_factura || '').toUpperCase();
                    const nom = String(item.NOM_CLIENTE || item.nom_cliente || '').toUpperCase();
                    const ruc = String(item.RUC_CLIENTE || item.ruc_cliente || '').toUpperCase();
                    const timb = String(item.NRO_TIMBRADO || item.nro_timbrado || '').toUpperCase();
                    const tip = String(item.TIP_DOC || item.tip_doc || '').toUpperCase();
                    return fac.includes(query) || nom.includes(query) || ruc.includes(query) || timb.includes(query) || tip.includes(query);
                });
            }
            renderTabla(filtered);
        }

        function actualizarTimbradosPorTipoDoc() {
            const select = document.getElementById('nroTimbrado');
            const tipDocVal = (document.getElementById('tipDoc').value || '').trim().toUpperCase();
            const currentSelected = select.value;
            select.innerHTML = '';

            if (!listTimbradosCache || listTimbradosCache.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.text = '-- No hay timbrados registrados --';
                select.appendChild(opt);
                document.getElementById('vencTimbrado').value = '';
                return;
            }

            const filtrados = listTimbradosCache.filter(item => {
                const doc = (item.TIP_DOC || item.tip_doc || '').trim().toUpperCase();
                return doc === tipDocVal;
            });

            const listaAMostrar = (filtrados.length > 0) ? filtrados : listTimbradosCache;

            listaAMostrar.forEach((item) => {
                const nro = item.NRO_TIMBRADO || item.nro_timbrado || '';
                const est = String(item.COD_ESTABLECIMIENTO || item.cod_establecimiento || '001').padStart(3, '0');
                const pto = String(item.COD_PUNTO_EXPEDICION || item.cod_punto_expedicion || '001').padStart(3, '0');

                const opt = document.createElement('option');
                opt.value = nro;
                opt.text = `${nro} (${est}-${pto})`;
                select.appendChild(opt);
            });

            if (currentSelected && Array.from(select.options).some(o => o.value === currentSelected)) {
                select.value = currentSelected;
            } else if (listaAMostrar.length > 0) {
                select.selectedIndex = 0;
            }
            alSeleccionarTimbrado();
        }

        function alSeleccionarTimbrado() {
            const select = document.getElementById('nroTimbrado');
            const nroSelected = select.value;
            if (!nroSelected || listTimbradosCache.length === 0) return;

            const item = listTimbradosCache.find(x => (x.NRO_TIMBRADO || x.nro_timbrado) == nroSelected);
            if (item) {
                const tipoTimbStr = (item.TIPO_TIMBRADO || item.tipo_timbrado || '').trim().toLowerCase();
                const fecVenc = item.FEC_VENCIMIENTO || item.fec_vencimiento;

                if (tipoTimbStr.includes('electr')) {
                    document.getElementById('vencTimbrado').value = '2100-12-31';
                } else if (fecVenc) {
                    let cleanVenc = fecVenc.includes('T') ? fecVenc.split('T')[0] : (fecVenc.includes(' ') ? fecVenc.split(' ')[0] : fecVenc);
                    document.getElementById('vencTimbrado').value = cleanVenc;
                }

                if (item.COD_ESTABLECIMIENTO || item.cod_establecimiento) {
                    document.getElementById('facEst').value = String(item.COD_ESTABLECIMIENTO || item.cod_establecimiento).padStart(3, '0');
                }
                if (item.COD_PUNTO_EXPEDICION || item.cod_punto_expedicion) {
                    document.getElementById('facPto').value = String(item.COD_PUNTO_EXPEDICION || item.cod_punto_expedicion).padStart(3, '0');
                }

                if (item.TIP_DOC || item.tip_doc) {
                    const tipDocSelect = document.getElementById('tipDoc');
                    const targetDoc = (item.TIP_DOC || item.tip_doc).toUpperCase();
                    for (let opt of tipDocSelect.options) {
                        if (opt.value.toUpperCase() === targetDoc) {
                            tipDocSelect.value = opt.value;
                            break;
                        }
                    }
                }
            }
            validarFechasComprobanteVencimiento();
        }

        function formatCDC(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.length > 44) val = val.substring(0, 44);
            input.value = val;
        }

        function parseMonto(val) {
            if (typeof val === 'number') return Math.round(val);
            let s = String(val || '').trim();
            if (!s) return 0;
            if (/^-?\d+\.\d{1,2}$/.test(s)) {
                return Math.round(parseFloat(s) || 0);
            }
            let clean = s.replace(/\./g, '').replace(',', '.');
            return Math.round(parseFloat(clean) || 0);
        }

        function formatMiles(val) {
            return parseMonto(val).toLocaleString('es-PY');
        }

        function formatearInputMiles(input) {
            let raw = String(input.value || '').replace(/\D/g, '');
            if (raw === '') {
                input.value = '';
                return;
            }
            let num = parseInt(raw, 10);
            if (isNaN(num)) num = 0;
            input.value = num.toLocaleString('es-PY');
        }

        function recalcularTotales() {
            const g10 = parseMonto(document.getElementById('grav10').value);
            const g5 = parseMonto(document.getElementById('grav5').value);
            const ex = parseMonto(document.getElementById('exentas').value);
            const noGrav = parseMonto(document.getElementById('noGravado').value);
            const red = parseMonto(document.getElementById('redondeo').value);

            const i10 = Math.round(g10 / 11);
            const i5 = Math.round(g5 / 21);
            const tIva = i10 + i5;

            const vBruto = g10 + g5 + ex + noGrav;
            const vTotal = vBruto + red;

            document.getElementById('iva10').value = i10.toLocaleString('es-PY');
            document.getElementById('iva5').value = i5.toLocaleString('es-PY');
            document.getElementById('totIva').value = tIva.toLocaleString('es-PY');
            document.getElementById('valorBruto').value = vBruto.toLocaleString('es-PY');
            document.getElementById('valorTotal').value = vTotal.toLocaleString('es-PY');
        }

        function verificarCDC(rawInputOverride = null) {
            const cdc = (rawInputOverride || document.getElementById('cdc').value || '').trim();
            if (!cdc) {
                Swal.fire('Atención', 'Ingrese el Código CDC de 44 dígitos.', 'warning');
                return;
            }
            fetch('/api/sifen/consultar-cdc', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cdc: cdc })
            })
                .then(res => res.json())
                .then(data => {
                    if (data.valido) {
                        if (data.cdc) document.getElementById('cdc').value = data.cdc;
                        if (data.establecimiento) document.getElementById('facEst').value = data.establecimiento;
                        if (data.puntoExpedicion) document.getElementById('facPto').value = data.puntoExpedicion;
                        if (data.numeroDocumento) document.getElementById('facNro').value = data.numeroDocumento;
                        if (data.fechaFactura) document.getElementById('fecIngreso').value = data.fechaFactura;
                        if (data.grav10 && parseFloat(data.grav10) > 0) {
                            document.getElementById('grav10').value = formatMiles(data.grav10);
                        }
                        if (data.grav5 && parseFloat(data.grav5) > 0) {
                            document.getElementById('grav5').value = formatMiles(data.grav5);
                        }
                        if (data.exentas && parseFloat(data.exentas) > 0) {
                            document.getElementById('exentas').value = formatMiles(data.exentas);
                        }
                        recalcularTotales();
                        Swal.fire({
                            icon: 'success',
                            title: 'CDC SIFEN Verificado',
                            html: `<b>Tipo:</b> ${data.tipoDoc || 'Factura Electrónica'}<br><b>Comprobante:</b> ${data.nroFactura || '-'}<br><b>Fecha:</b> ${data.fechaFactura || '-'}<br><b>Estado:</b> ${data.estadoSifen || 'Válido'}`,
                            confirmButtonColor: '#16a34a'
                        });
                    } else {
                        Swal.fire('CDC Inválido', data.message || 'El CDC ingresado no es válido.', 'error');
                    }
                })
                .catch(err => {
                    Swal.fire('Error', 'No se pudo verificar el CDC.', 'error');
                });
        }

        function procesarQR() {
            const url = (document.getElementById('qrText').value || '').trim();
            if (!url) {
                Swal.fire('Atención', 'Pegue la URL del QR o el CDC de 44 dígitos.', 'warning');
                return;
            }
            const match = url.match(/([0-9]{44})/);
            if (match && match[1]) {
                document.getElementById('cdc').value = match[1];
                cerrarQRModal();
                verificarCDC(url);
                return;
            }
            Swal.fire('Atención', 'No se encontró un CDC válido de 44 dígitos en la cadena ingresada.', 'warning');
        }

        async function verificarYCrearClienteIngreso(esBusquedaManual = false) {
            const rucVal = document.getElementById('rucCliente').value.trim();
            if (!rucVal || rucVal.length < 3) return;

            // Limpiar Razón Social previa antes de verificar
            document.getElementById('nomCliente').value = '';

            try {
                // 1. Verificar si ya existe como Cliente o Persona en BD local
                let data1 = {};
                try {
                    const res1 = await fetch('/api/co_clientes/auto-registrar-ruc', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ruc: rucVal, nombre: '' })
                    });
                    const txt1 = await res1.text();
                    data1 = txt1 ? JSON.parse(txt1) : {};
                } catch (ignored) {}

                if (data1.status === 'CLIENTE_EXISTE') {
                    document.getElementById('rucCliente').value = data1.ruc || rucVal;
                    document.getElementById('nomCliente').value = data1.nombre || '';
                    document.getElementById('codCliente').value = data1.codCliente || '';
                    // Silencioso para clientes existentes: Carga el nombre sin popups ni alertas
                    return;
                }

                if (data1.status === 'CREADO') {
                    document.getElementById('rucCliente').value = data1.ruc || rucVal;
                    document.getElementById('nomCliente').value = data1.nombre || '';
                    document.getElementById('codCliente').value = data1.codCliente || '';
                    Swal.fire({
                        icon: 'success',
                        title: '¡Nuevo Cliente Registrado!',
                        html: `Persona encontrada en BD local y registrada como <b>Cliente #${data1.codCliente}</b>:<br><b>${data1.nombre}</b>.`,
                        confirmButtonColor: '#16a34a'
                    });
                    return;
                }

                // 2. Si no existe en la BD local, buscar en turuc.com.py (DNIT)
                const rucBase = rucVal.split('-')[0].trim();
                let dataDnit = null;
                try {
                    const resDnit = await fetch(`/api/dnit/consultar-ruc?ruc=${encodeURIComponent(rucBase)}`);
                    if (resDnit.ok) {
                        const txtDnit = await resDnit.text();
                        const jsonProxy = txtDnit ? JSON.parse(txtDnit) : {};
                        if (jsonProxy.status === 'SUCCESS' && jsonProxy.data) {
                            dataDnit = { data: jsonProxy.data };
                        }
                    }
                } catch (ignored) {}

                if (dataDnit && dataDnit.data && dataDnit.data.razonSocial) {
                    const d = dataDnit.data;
                    const nomDnit = d.razonSocial;
                    let rucToUse = d.ruc || rucBase;
                    if (d.dv !== undefined && !String(rucToUse).includes('-')) {
                        rucToUse = `${rucToUse}-${d.dv}`;
                    }

                    document.getElementById('rucCliente').value = rucToUse;
                    document.getElementById('nomCliente').value = nomDnit;

                    // 3. Crear automáticamente como Persona y Cliente en la BD
                    try {
                        const resCreate = await fetch('/api/co_clientes/auto-registrar-ruc', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ruc: rucToUse, nombre: nomDnit })
                        });
                        const txtCreate = await resCreate.text();
                        const dataCreate = txtCreate ? JSON.parse(txtCreate) : {};

                        if (dataCreate.status === 'CREADO') {
                            document.getElementById('codCliente').value = dataCreate.codCliente || '';
                            Swal.fire({
                                icon: 'success',
                                title: '¡Nuevo Cliente Creado!',
                                html: `RUC verificado en la DNIT (turuc.com.py).<br>Se creó la persona y el <b>Cliente #${dataCreate.codCliente || ''}</b>:<br><b>${nomDnit}</b>`,
                                confirmButtonColor: '#16a34a'
                            });
                        } else if (dataCreate.status === 'CLIENTE_EXISTE') {
                            document.getElementById('codCliente').value = dataCreate.codCliente || '';
                            document.getElementById('rucCliente').value = dataCreate.ruc || rucToUse;
                            document.getElementById('nomCliente').value = dataCreate.nombre || nomDnit;
                        }
                    } catch (createErr) {
                        console.warn('Advertencia al auto-registrar cliente en BD local:', createErr);
                    }
                } else {
                    document.getElementById('nomCliente').value = '';
                    Swal.fire({
                        icon: 'warning',
                        title: 'RUC No Encontrado o Inválido',
                        text: 'El RUC no fue encontrado en la base local ni en la DNIT (turuc.com.py).',
                        confirmButtonColor: '#16a34a'
                    });
                }

            } catch (e) {
                console.error('Error al verificar RUC en Ingresos:', e);
                document.getElementById('nomCliente').value = '';
            }
        }

            const { value: rucInput } = await Swal.fire({
