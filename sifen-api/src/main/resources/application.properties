# ============================================================================
# ContaPro - Microservicio SIFEN API (Java Spring Boot)
# Listo para desplegar en Oracle Cloud Infrastructure (OCI)
# ============================================================================
server.port=${PORT:8085}
spring.application.name=contapro-sifen-api

# Token de seguridad compartido entre ContaPro (cPanel PHP) y este microservicio (OCI)
sifen.api.key=${SIFEN_API_KEY:contapro-sifen-secret-2026}

# Endpoints oficiales SIFEN v150 (DNIT Paraguay)
sifen.url.test.recepcion=https://sifen-test.set.gov.py/de/ws/sync/recep.wsdl
sifen.url.test.evento=https://sifen-test.set.gov.py/de/ws/eventos/evento.wsdl
sifen.url.test.consulta=https://sifen-test.set.gov.py/de/ws/consultas/consulta.wsdl
sifen.url.test.consulta.ruc=https://sifen-test.set.gov.py/de/ws/consultas/consulta-ruc.wsdl
sifen.url.test.qr=https://ekuatia.set.gov.py/consultas-test/qr?

sifen.url.prod.recepcion=https://sifen.set.gov.py/de/ws/sync/recep.wsdl
sifen.url.prod.evento=https://sifen.set.gov.py/de/ws/eventos/evento.wsdl
sifen.url.prod.consulta=https://sifen.set.gov.py/de/ws/consultas/consulta.wsdl
sifen.url.prod.consulta.ruc=https://sifen.set.gov.py/de/ws/consultas/consulta-ruc.wsdl
sifen.url.prod.qr=https://ekuatia.set.gov.py/consultas/qr?

# Timeouts de conexión con la DNIT (milisegundos)
sifen.timeout.connect=15000
sifen.timeout.read=30000
